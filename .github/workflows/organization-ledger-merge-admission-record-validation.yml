name: Validate Merge Admission Record Append

# PR-facing checks for the MERGE_ADMISSION_RECORD writer operation
# (resident-runtime/merge_admission_record_append.py) and its consumer, the B2
# checkpoint (resident-runtime/merge_transfer_admission.py). Read-only: temp
# ledgers are copies of the pinned ledger tip. There is no writer workflow for
# this op: record delivery from TVC is a TV/TVC transition that does not exist yet.
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/organization-ledger-merge-admission-record-validation.yml'
      - 'resident-runtime/merge_admission_record_append.py'
      - 'resident-runtime/merge_transfer_admission.py'
      - 'resident-runtime/merge_transfer.py'
      - 'resident-runtime/intr_destination_ingress.py'
      - 'data/merge-admission/**'
      - 'tests/test_merge_admission_record_append.py'
      - 'tests/fixtures/merge-admission-record/**'

permissions:
  contents: read

env:
  LEDGER_REF: refs/stegverse/organization-ledger

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout organization boundary (full history)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Fetch the ledger ref read-only (the fixtures pin a commit on it)
        run: git fetch --no-tags origin "+$LEDGER_REF:$LEDGER_REF"

      - name: Append, B2 checkpoint ALLOW, refusals (temp ledgers from the pinned tip)
        run: python3 -m unittest tests.test_merge_admission_record_append tests.test_merge_transfer_admission tests.test_governed_ingress_census tests.test_workflow_action_pins -v
