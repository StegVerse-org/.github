name: Governed remediation preflight source tests (non-authorizing)

on:
  pull_request:
    paths:
      - 'resident-runtime/governed_remediation_return_preflight.py'
      - 'tests/test_governed_remediation_return_preflight.py'
      - '.github/workflows/governed-remediation-preflight-tests.yml'
  push:
    branches:
      - main
    paths:
      - 'resident-runtime/governed_remediation_return_preflight.py'
      - 'tests/test_governed_remediation_return_preflight.py'
      - '.github/workflows/governed-remediation-preflight-tests.yml'

permissions:
  contents: read

jobs:
  source-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run non-authorizing source regression tests
        run: python -m unittest discover -s tests -p test_governed_remediation_return_preflight.py -v
