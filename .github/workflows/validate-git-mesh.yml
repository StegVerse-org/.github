name: Validate Git-ref Federation Mesh
on:
  pull_request:
    paths:
      - 'org-kernel/node_store.py'
      - 'org-kernel/kernel.py'
      - 'tests/test_git_mesh_store.py'
      - '.github/workflows/validate-git-mesh.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  git-mesh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run durable mesh regressions
        run: python -m unittest discover -s tests -p test_git_mesh_store.py -v
