name: Validate InTr Ingress Ledger Component

# PR-facing checks for components/intr-ingress-ledger/v1: pinned bytes, a
# deterministic install into a temporary copy of an unadopted organization's
# documents, the installed tests there, and every refusal. Read-only; nothing
# is pushed or dispatched; receipts go to temporary ledgers only.
on:
  pull_request:
    branches: [main]
    paths:
      - 'components/intr-ingress-ledger/**'
      - 'resident-runtime/intr_ingress_ledger_component.py'
      - 'tests/test_intr_ingress_ledger_component_package.py'
      - 'tests/fixtures/intr-ingress-ledger-component/**'
      - 'org-runtime/intr_protocol.py'
      - 'data/intr-protocol/v1/protocol.json'
      - 'docs/INTR_INGRESS_LEDGER_COMPONENT_V1.md'
      - '.github/workflows/intr-ingress-ledger-component-validation.yml'
  push:
    branches: [main]
    paths:
      - 'components/intr-ingress-ledger/**'
      - 'resident-runtime/intr_ingress_ledger_component.py'
      - 'tests/test_intr_ingress_ledger_component_package.py'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout organization boundary
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Pinned bytes, install, installed tests, refusals
        run: python3 -m unittest tests.test_intr_ingress_ledger_component_package -v
