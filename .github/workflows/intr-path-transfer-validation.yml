name: Validate InTr Mesh Path Transfer

# PR-facing checks for the path-transfer writer (intr-path-transfer.yml).
# Read-only: the published ledger ref is fetched, copied to a scratch ref, and
# the writer's own commands run against that copy. Nothing is pushed. Receipts
# written to the scratch ref are not ledgered and not authentic.
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/intr-path-transfer.yml'
      - '.github/workflows/intr-path-ingress.yml'
      - '.github/workflows/intr-path-transfer-validation.yml'
      - '.stegverse/intr-path-transfer/**'
      - 'resident-runtime/intr_path_transfer.py'
      - 'resident-runtime/intr_path_ingress.py'
      - 'resident-runtime/intr_path_tvc_read.py'
      - 'tests/test_intr_path_tvc_read.py'
      - 'tests/fixtures/intr-path-tvc-read/**'
      - 'resident-runtime/merge_transfer.py'
      - 'resident-runtime/intr_destination_ingress.py'
      - 'org-runtime/intr_protocol.py'
      - 'data/intr-protocol/v1/protocol.json'
      - 'tests/fixtures/intr-protocol/destinations/**'
      - 'tests/test_intr_path_transfer.py'
      - 'tests/test_intr_path_ingress.py'
      - 'tests/test_intr_path_public_ledger_read.py'
      - 'tests/fixtures/intr-path-ingress/**'
      - 'tests/fixtures/intr-path-transfer/**'
      - 'docs/INTR_PATH_TRANSFER_V1.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/intr-path-transfer.yml'
      - '.github/workflows/intr-path-ingress.yml'
      - '.github/workflows/intr-path-transfer-validation.yml'
      - '.stegverse/intr-path-transfer/**'
      - 'resident-runtime/intr_path_transfer.py'
      - 'resident-runtime/intr_path_ingress.py'
      - 'resident-runtime/intr_path_tvc_read.py'
      - 'tests/test_intr_path_tvc_read.py'
      - 'tests/fixtures/intr-path-tvc-read/**'
      - 'tests/test_intr_path_transfer.py'
      - 'tests/test_intr_path_ingress.py'
      - 'tests/test_intr_path_public_ledger_read.py'
      - 'tests/fixtures/intr-path-ingress/**'
      - 'tests/fixtures/intr-path-transfer/**'

permissions:
  contents: read

env:
  LEDGER_REF: refs/stegverse/organization-ledger
  DRY_RUN_REF: refs/dry-run/organization-ledger

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout organization boundary (full history)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Fetch the ledger ref read-only (the fixtures pin a commit on it)
        run: git fetch --no-tags origin "+$LEDGER_REF:$LEDGER_REF"

      - name: Declared paths, append, two-half verify, refusals (temp ledgers from the pinned tip)
        run: python3 -m unittest tests.test_intr_path_transfer -v

      - name: Destination carrier, ingress append, link and end-to-end checks (synthetic source receipts, temp ledgers)
        run: python3 -m unittest tests.test_intr_path_ingress -v

      - name: Cross-organization pair check through TV/TVC (TVC#528 fixture receipts; no token; real state FAIL_CLOSED at the TVC transition)
        run: |
          set -euo pipefail
          python3 -m unittest tests.test_intr_path_tvc_read -v
          # real state: no TVC read receipt is landed, so the other organization's half is FAIL_CLOSED with retry at TVC
          python3 resident-runtime/intr_path_ingress.py end-to-end-via-tvc \
            --path-id 'SV-011->StegVerse-org:intr-destination' --communication-id 'intr-path-v1:SV-011->StegVerse-org' \
            --out "$RUNNER_TEMP/pair.json" > /dev/null || true
          python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); six=("failure_code","failed_predicate","required_evidence_or_repair","retry_entrypoint","owning_existing_goal","next_attempt"); assert r["disposition"] != "ALLOW", r; assert all(r.get(f) for f in six), r; print("INTR_PATH_PAIR_REAL_STATE", r["disposition"], r["failure_code"], r["retry_entrypoint"][:60])' "$RUNNER_TEMP/pair.json"

      - name: Public-ledger route of the cross-org read (E0, no credential); inbound rows dry-run end to end on a scratch ref
        run: |
          set -euo pipefail
          python3 -m unittest tests.test_intr_path_public_ledger_read -v
          # Anonymous read (no credential, no auth header) of each inbound row's source ledger. A private or internal
          # source is not readable this way; its copy is absent and the verifier stays on the TV/TVC route (FAIL_CLOSED).
          pub="$RUNNER_TEMP/public-ledgers"; mkdir -p "$pub"
          if [ -f .stegverse/intr-path-transfer/inbound.json ]; then
            for org in $(python3 -c 'import json; print(" ".join(sorted({r["path_id"].split("->")[0] for r in json.load(open(".stegverse/intr-path-transfer/inbound.json"))["transfers"]})))'); do
              git init -q --bare "$pub/$org.git"
              if ! GIT_TERMINAL_PROMPT=0 git --git-dir="$pub/$org.git" -c credential.helper= -c http.https://github.com/.extraheader= \
                  fetch -q --no-tags "https://github.com/$org/.github" "+$LEDGER_REF:$LEDGER_REF"; then
                rm -rf "$pub/$org.git"; echo "NOT_ANONYMOUSLY_READABLE $org (TV/TVC route applies)"
              fi
            done
          fi
          # Dry run on a scratch copy of this ledger: consume, verify, then end to end per row. Not ledgered, not authentic.
          scratch="$RUNNER_TEMP/scratch.git"; git init -q --bare "$scratch"
          echo "$GITHUB_WORKSPACE/.git/objects" > "$scratch/objects/info/alternates"
          git --git-dir="$scratch" update-ref "$LEDGER_REF" "$(git rev-parse "$LEDGER_REF")"
          namespace=$(python3 -c 'import json; print(json.load(open(".stegverse/transition-ledger/contract.json"))["repository_ledger_location"]["namespace"])')
          export STEGVERSE_ORG_LEDGER_ROOT="git+$scratch#$LEDGER_REF" STEGVERSE_REPO_LEDGER_ROOT="git+$scratch#$LEDGER_REF:$namespace"
          export STEGVERSE_INTR_PUBLIC_LEDGERS="$pub"
          python3 resident-runtime/intr_path_ingress.py consume --out "$RUNNER_TEMP/dry-consume.json" > /dev/null || true
          python3 resident-runtime/intr_path_ingress.py verify --out "$RUNNER_TEMP/dry-verify.json" > /dev/null || true
          python3 - "$RUNNER_TEMP" "$pub" <<'PY'
          import json, subprocess, sys
          tmp, pub = sys.argv[1], sys.argv[2]
          six = ("failure_code", "failed_predicate", "required_evidence_or_repair", "retry_entrypoint",
                 "owning_existing_goal", "next_attempt")
          rows = json.load(open(".stegverse/intr-path-transfer/inbound.json"))["transfers"] if __import__("os").path.isfile(".stegverse/intr-path-transfer/inbound.json") else []
          for name in ("dry-consume", "dry-verify"):
              for r in (json.load(open(tmp + "/" + name + ".json")) if rows else []):
                  assert r["disposition"] in ("ALLOW", "DENY", "FAIL_CLOSED"), r
                  assert r["disposition"] == "ALLOW" or all(r.get(f) for f in six), r
          for row in rows:
              out = tmp + "/dry-e2e.json"
              subprocess.run(["python3", "resident-runtime/intr_path_ingress.py", "end-to-end-via-tvc", "--path-id", row["path_id"],
                              "--communication-id", row["communication_id"], "--public-ledgers", pub, "--out", out],
                             stdout=subprocess.DEVNULL, check=False)
              r = json.load(open(out))
              assert r["disposition"] in ("ALLOW", "DENY", "FAIL_CLOSED"), r
              assert r["disposition"] == "ALLOW" or all(r.get(f) for f in six), r
              print("INTR_PATH_E0_DRY_RUN", row["path_id"], r["disposition"], r.get("path"), r.get("failure_code"))
          PY

  dry-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout organization boundary (full history)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Copy the published ledger to a scratch ref
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+$LEDGER_REF:$DRY_RUN_REF"
          echo "published ledger tip: $(git rev-parse "$DRY_RUN_REF")"
          git rev-parse "$DRY_RUN_REF" > "$RUNNER_TEMP/published-tip"
          namespace=$(python3 -c 'import json; print(json.load(open(".stegverse/transition-ledger/contract.json"))["repository_ledger_location"]["namespace"])')
          echo "REPO_LEDGER_NAMESPACE=$namespace" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/results"

      - name: "Real state, read-only: inspect actual source halves without assuming absent receipts"
        run: |
          set -euo pipefail
          export STEGVERSE_ORG_LEDGER_ROOT="git+$GITHUB_WORKSPACE#$DRY_RUN_REF"
          export STEGVERSE_REPO_LEDGER_ROOT="git+$GITHUB_WORKSPACE#$DRY_RUN_REF:$REPO_LEDGER_NAMESPACE"
          python3 resident-runtime/intr_path_transfer.py verify --out "$RUNNER_TEMP/results/real-state.json" > /dev/null
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          state = json.loads((Path(os.environ["RUNNER_TEMP"]) / "results/real-state.json").read_text())
          own = [p for p in state["paths"] if p["path_id"].startswith("StegVerse-org->")]
          assert own, "no source paths examined"
          assert all(p["halves"]["source"] in ("ALLOW", "FAIL_CLOSED") for p in own), own
          print("INTR_PATH_REAL_STATE", json.dumps(state["counts"]))
          PY

      - name: The writer's append on the scratch ref, linked to the last ledgered main merge
        run: |
          set -euo pipefail
          export STEGVERSE_ORG_LEDGER_ROOT="git+$GITHUB_WORKSPACE#$DRY_RUN_REF"
          export STEGVERSE_REPO_LEDGER_ROOT="git+$GITHUB_WORKSPACE#$DRY_RUN_REF:$REPO_LEDGER_NAMESPACE"
          # a main merge whose main-merge transfer receipt is on the ledger (pinned in the expected real state)
          base=$(python3 -c 'import json; print(json.load(open("tests/fixtures/intr-path-transfer/expected-real-state.json"))["verified_transfer_commit"])')
          # an organization with no main-merge transfer receipt yet: append the pinned merges to the scratch ref first
          for c in $(python3 -c 'import json; print(" ".join(json.load(open("tests/fixtures/intr-path-transfer/expected-real-state.json")).get("temp_merge_transfers") or []))'); do
            python3 resident-runtime/merge_transfer.py append --commit "$c" > /dev/null
          done
          python3 resident-runtime/intr_path_transfer.py append --transfer-commit "$base" --out "$RUNNER_TEMP/results/append.json" > /dev/null
          python3 resident-runtime/intr_path_transfer.py verify --expect-source ALLOW --out "$RUNNER_TEMP/results/verify.json" > /dev/null
          tip=$(git rev-parse "$DRY_RUN_REF")
          python3 resident-runtime/intr_path_transfer.py append --transfer-commit "$base" --out "$RUNNER_TEMP/results/replay.json" > /dev/null
          test "$(git rev-parse "$DRY_RUN_REF")" = "$tip"
          python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); assert all(x.get("replayed") is True for x in r), r' "$RUNNER_TEMP/results/replay.json"
          # A previously ledgered path replays without moving the scratch tip.
          # The published ref must remain unchanged by this read-only dry run.
          test "$(git ls-remote origin "$LEDGER_REF" | cut -f1)" = "$(cat "$RUNNER_TEMP/published-tip")"
          python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); print("INTR_PATH_DRY_RUN", json.dumps(r["counts"]))' "$RUNNER_TEMP/results/verify.json"
