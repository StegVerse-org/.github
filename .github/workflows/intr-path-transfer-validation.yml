name: Validate InTr Mesh Path Transfer

# PR-facing checks for the path-transfer writer (intr-path-transfer.yml).
# Read-only: the published ledger ref is fetched, copied to a scratch ref, and
# the writer's own commands run against that copy. Nothing is pushed. Receipts
# written to the scratch ref are not ledgered and not authentic.
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/intr-path-transfer.yml'
      - '.github/workflows/intr-path-ingress.yml'
      - '.github/workflows/intr-path-transfer-validation.yml'
      - '.stegverse/intr-path-transfer/**'
      - 'resident-runtime/intr_path_transfer.py'
      - 'resident-runtime/intr_path_ingress.py'
      - 'resident-runtime/intr_path_ledger.py'
      - 'resident-runtime/intr_path_tvc_read.py'
      - 'tests/test_intr_path_tvc_read.py'
      - 'tests/fixtures/intr-path-tvc-read/**'
      - 'resident-runtime/merge_transfer_gitstore.py'
      - 'resident-runtime/ledger_gitstore.py'
      - 'tests/intr_path_temp_ledger.py'
      - 'tests/test_intr_path_ledger.py'
      - 'tests/fixtures/intr-path-ledger/**'
      - 'resident-runtime/merge_transfer.py'
      - 'resident-runtime/intr_destination_ingress.py'
      - 'org-runtime/intr_protocol.py'
      - 'data/intr-protocol/v1/protocol.json'
      - 'tests/fixtures/intr-protocol/destinations/**'
      - 'tests/test_intr_path_transfer.py'
      - 'tests/test_intr_path_ingress.py'
      - 'tests/fixtures/intr-path-ingress/**'
      - 'tests/fixtures/intr-path-transfer/**'
      - 'docs/INTR_PATH_TRANSFER_V1.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/intr-path-transfer.yml'
      - '.github/workflows/intr-path-ingress.yml'
      - '.github/workflows/intr-path-transfer-validation.yml'
      - '.stegverse/intr-path-transfer/**'
      - 'resident-runtime/intr_path_transfer.py'
      - 'resident-runtime/intr_path_ingress.py'
      - 'resident-runtime/intr_path_ledger.py'
      - 'resident-runtime/intr_path_tvc_read.py'
      - 'tests/test_intr_path_tvc_read.py'
      - 'tests/fixtures/intr-path-tvc-read/**'
      - 'resident-runtime/merge_transfer_gitstore.py'
      - 'resident-runtime/ledger_gitstore.py'
      - 'tests/intr_path_temp_ledger.py'
      - 'tests/test_intr_path_ledger.py'
      - 'tests/fixtures/intr-path-ledger/**'
      - 'tests/test_intr_path_transfer.py'
      - 'tests/test_intr_path_ingress.py'
      - 'tests/fixtures/intr-path-ingress/**'
      - 'tests/fixtures/intr-path-transfer/**'

permissions:
  contents: read

env:
  LEDGER_REF: refs/stegverse/organization-ledger

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout organization boundary (full history)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Fetch the ledger ref read-only (the fixtures pin a commit on it)
        run: git fetch --no-tags origin "+$LEDGER_REF:$LEDGER_REF"

      - name: Declared paths, append, two-half verify, refusals (temp ledgers from the pinned tip)
        run: python3 -m unittest tests.test_intr_path_transfer -v

      - name: Destination carrier, ingress append, link and end-to-end checks (synthetic source receipts, temp ledgers)
        run: python3 -m unittest tests.test_intr_path_ingress -v

      - name: Ledger binding per organization (protocol.json pin); git-store backend over Lane D's pinned modules
        run: python3 -m unittest tests.test_intr_path_ledger -v

      - name: Cross-organization pair check through TV/TVC (TVC#528 fixture receipts; no token; real state FAIL_CLOSED at the TVC transition)
        run: |
          set -euo pipefail
          python3 -m unittest tests.test_intr_path_tvc_read -v
          # real state: no TVC read receipt is landed, so the other organization's half is FAIL_CLOSED with retry at TVC
          python3 resident-runtime/intr_path_ingress.py end-to-end-via-tvc \
            --path-id 'SV-011->StegVerse-org:intr-destination' --communication-id 'intr-path-v1:SV-011->StegVerse-org' \
            --out "$RUNNER_TEMP/pair.json" > /dev/null || true
          python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); six=("failure_code","failed_predicate","required_evidence_or_repair","retry_entrypoint","owning_existing_goal","next_attempt"); assert r["disposition"] != "ALLOW", r; assert all(r.get(f) for f in six), r; print("INTR_PATH_PAIR_REAL_STATE", r["disposition"], r["failure_code"], r["retry_entrypoint"][:60])' "$RUNNER_TEMP/pair.json"

  dry-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout organization boundary (full history)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Copy the published ledger into a scratch git dir
        # The scratch git dir carries the ledger at its designated ref name: an organization's
        # writer holds the organization half to org-contract.json's declared ref
        # (StegVerse-Labs: organization_ledger_locus_mismatch otherwise). It is never pushed.
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+$LEDGER_REF:$LEDGER_REF"
          published=$(git rev-parse "$LEDGER_REF")
          echo "PUBLISHED_TIP=$published" >> "$GITHUB_ENV"
          echo "published ledger tip: $published"
          scratch="$RUNNER_TEMP/scratch-ledger.git"
          git init -q --bare "$scratch"
          git --git-dir="$scratch" fetch -q "$GITHUB_WORKSPACE" "+$LEDGER_REF:$LEDGER_REF"
          namespace=$(python3 -c 'import json; print(json.load(open(".stegverse/transition-ledger/contract.json"))["repository_ledger_location"]["namespace"])')
          {
            echo "SCRATCH=$scratch"
            echo "STEGVERSE_ORG_LEDGER_ROOT=git+$scratch#$LEDGER_REF"
            echo "STEGVERSE_ORG_LEDGER_GIT_DIR=$scratch"
            echo "STEGVERSE_REPO_LEDGER_ROOT=git+$scratch#$LEDGER_REF:$namespace"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/results"

      - name: "Real state, read-only: every declared path is FAIL_CLOSED (no path receipt)"
        run: |
          set -euo pipefail
          python3 resident-runtime/intr_path_transfer.py verify --expect-source FAIL_CLOSED --out "$RUNNER_TEMP/results/real-state.json" > /dev/null
          python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); assert r["counts"]["ALLOW"] == 0, r["counts"]; print("INTR_PATH_REAL_STATE", json.dumps(r["counts"]))' "$RUNNER_TEMP/results/real-state.json"

      - name: The writer's append on the scratch copy, linked to the last ledgered main merge
        env:
          GIT_AUTHOR_NAME: dry-run
          GIT_AUTHOR_EMAIL: dry-run@invalid
          GIT_COMMITTER_NAME: dry-run
          GIT_COMMITTER_EMAIL: dry-run@invalid
        run: |
          python3 resident-runtime/intr_path_ledger.py which
          set -euo pipefail
          # a main merge whose main-merge transfer receipt is on the ledger (pinned in the expected real state)
          base=$(python3 -c 'import json; print(json.load(open("tests/fixtures/intr-path-transfer/expected-real-state.json"))["verified_transfer_commit"])')
          # an organization with no main-merge transfer receipt yet: append the pinned merges to the scratch copy first
          for c in $(python3 -c 'import json; print(" ".join(json.load(open("tests/fixtures/intr-path-transfer/expected-real-state.json")).get("temp_merge_transfers") or []))'); do
            python3 resident-runtime/intr_path_ledger.py append-merge-transfer --commit "$c" > /dev/null
          done
          python3 resident-runtime/intr_path_transfer.py append --transfer-commit "$base" --out "$RUNNER_TEMP/results/append.json" > /dev/null
          python3 resident-runtime/intr_path_transfer.py verify --expect-source ALLOW --out "$RUNNER_TEMP/results/verify.json" > /dev/null
          tip=$(git --git-dir="$SCRATCH" rev-parse "$LEDGER_REF")
          python3 resident-runtime/intr_path_transfer.py append --transfer-commit "$base" --out "$RUNNER_TEMP/results/replay.json" > /dev/null
          test "$(git --git-dir="$SCRATCH" rev-parse "$LEDGER_REF")" = "$tip"
          python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); assert all(x.get("replayed") is True for x in r), r' "$RUNNER_TEMP/results/replay.json"
          # the appends landed on the scratch copy only: the workspace ref and the published ref are unchanged
          test "$tip" != "$PUBLISHED_TIP"
          test "$(git rev-parse "$LEDGER_REF")" = "$PUBLISHED_TIP"
          test "$(git ls-remote origin "$LEDGER_REF" | cut -f1)" != "$tip"
          python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); print("INTR_PATH_DRY_RUN", json.dumps(r["counts"]))' "$RUNNER_TEMP/results/verify.json"
