name: Organization Ledger Writer

# G17-WORKFLOW-SURFACE-MINIMIZATION (StegVerse-Labs/.github#167/#168), enforced
# retroactively under Rigel's 2026-10-24 direction: the five organization
# ledger / InTr writers are one workflow with one lifecycle (push to main,
# contents: write on the designated ledger ref, one appender at a time).
#
# The chain is internal and keyed by state transition, not by a workflow name:
#   plan               which writer transitions this push carries, read from the
#                      manifest control/workflow-surface-registry.json
#                      (writer_jobs[].paths) against the pushed range
#   merge-transfer     every push to main (was organization-ledger-merge-transfer.yml)
#   path-transfer      after a successful merge-transfer (was intr-path-transfer.yml,
#                      workflow_run on "Organization Ledger Main Merge Transfer")
#   path-ingress       after a successful merge-transfer (was intr-path-ingress.yml,
#                      the same workflow_run)
#   ledger-transition  when .stegverse/transition-requests/** changed
#                      (was organization-ledger-transition.yml)
#   governance-return  when .stegverse/governance-return-requests/** changed
#                      (was organization-governance-return.yml)
#   ledger-ingest      when .stegverse/organization-ledger-ingest/** changed: a
#                      committed ingest request (a test receipt sealed by its
#                      producer's CI) appended by the governed writer
#                      (resident-runtime/organization_ledger_ingest.py; the same
#                      route StegVerse-Labs/.github runs). No dispatch.
# Jobs run one after another because each publishes the same ledger ref
# fast-forward only. Their steps are the original steps unchanged except that
# github.event.workflow_run.head_sha is github.sha (the same commit: the
# workflow_run head of a push to main is that push).
#
# workflow_dispatch is removed (ACTION_BY_MANIFEST). The dispatch-only
# governance-return locators are FAIL_CLOSED pending in the registry; their steps
# stay in place and are unreachable on push, where github.event.inputs is empty.
# The ledger-transition self-closure mode is retired, not pending: it was an InTr
# hop inside one organization (Rigel's rule, 2026-10-25), and its steps are removed.
on:
  push:
    branches: [main]

permissions:
  contents: read

# ORGANIZATION_LEDGER_LOCK: one appender at a time. The fast-forward push is
# the compare-and-swap against the published ref.
concurrency:
  group: organization-ledger
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      ledger-transition: ${{ steps.plan.outputs.ledger-transition }}
      governance-return: ${{ steps.plan.outputs.governance-return }}
      ledger-ingest: ${{ steps.plan.outputs.ledger-ingest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select the writer transitions this push carries
        id: plan
        env:
          BEFORE: ${{ github.event.before }}
        run: python3 tools/tasks/writer_plan.py --before "$BEFORE" --after "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  # Folded from .github/workflows/organization-ledger-merge-transfer.yml (job `append`).
  # A merge on main is a state transition within this organization
  # (.stegverse/transition-ledger/org-contract.json organization_scope_rule:
  # EVERY_STATE_TRANSITION_OCCURRING_WITHIN_THE_ORGANIZATION_EMITS_AN_ORGANIZATION_RECEIPT).
  # The push that lands the merge is the trigger. There is no dispatch, schedule
  # or cross-repository call: the append is made in this repository, onto this
  # organization's own designated ledger ref, with this run's GITHUB_TOKEN.
  #
  # Each merge gets one repository receipt and one organization receipt through
  # the existing two-level append (resident-runtime/intr_destination_ingress.py
  # _append over emit.py / aggregate_repo_transition.py / ledger_store.py),
  # operation ORGANIZATION_MAIN_MERGE_TRANSFER, at the supplied epoch carried by
  # the ledger head (no clock). The transfer is VERIFIED only by
  # resident-runtime/merge_transfer.py verify on a fresh fetch of the published
  # ref; this run's success is not the evidence.
  #
  # B2 (StegVerse-org/.github#160 issuecomment-6353130407 section 1.3): the append
  # runs through resident-runtime/merge_transfer_admission.py, which calls
  # merge_transfer.py unchanged and adds admission_record_ref, merge_kind and
  # admission_checkpoint to the organization receipt's boundary. Every merge is
  # still receipted. After publish and verify, the checkpoint is read back from
  # the fresh fetch; a merged head that is not an admitted head fails this run
  # FAIL_CLOSED MERGED_HEAD_IS_NOT_THE_ADMITTED_HEAD with the six fields, so no
  # merge on main goes unobserved.
  #
  # Writer only. The PR-facing checks are
  # .github/workflows/organization-ledger-merge-transfer-validation.yml.
  # ORGANIZATION_LEDGER_LOCK: one appender at a time, shared with
  # organization-ledger-transition.yml. The fast-forward push is the
  # compare-and-swap against the published ref.
  merge-transfer:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      LEDGER_REF: refs/stegverse/organization-ledger
      BEFORE: ${{ github.event.before }}
    steps:
      - name: Checkout organization boundary
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Bind the designated organization ledger ref and the repository ledger subtree
        run: |
          set -euo pipefail
          ref=$(python3 -c 'import json; print(json.load(open(".stegverse/transition-ledger/org-contract.json")).get("organization_ledger_ref") or "refs/stegverse/organization-ledger")')
          test "$ref" = "$LEDGER_REF"
          namespace=$(python3 -c 'import json; l=json.load(open(".stegverse/transition-ledger/contract.json"))["repository_ledger_location"]; assert l["ref"]=="refs/stegverse/organization-ledger", l; print(l["namespace"])')
          echo "REPO_LEDGER_NAMESPACE=$namespace" >> "$GITHUB_ENV"
          # No head, no supplied epoch: the append below refuses (HB_EPOCH_SOURCE_UNOBSERVED).
          git fetch --no-tags origin "+$LEDGER_REF:$LEDGER_REF"
          echo "ledger tip: $(git rev-parse "$LEDGER_REF")"

      - name: Select the merges this push carries
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/results"
          # pending merges, then the push's base when it is on main with no receipt, then the pushed range
          # (resident-runtime/merge_transfer_range.py); the base is checked on the ledger about to be appended to
          export STEGVERSE_ORG_LEDGER_ROOT="git+$GITHUB_WORKSPACE#$LEDGER_REF"
          export STEGVERSE_REPO_LEDGER_ROOT="git+$GITHUB_WORKSPACE#$LEDGER_REF:$REPO_LEDGER_NAMESPACE"
          python3 resident-runtime/merge_transfer_range.py --before "$BEFORE" --after "$GITHUB_SHA" \
            --pending .stegverse/merge-transfer/pending.json > "$RUNNER_TEMP/results/commits.txt"
          cat "$RUNNER_TEMP/results/commits.txt"

      - name: Append each merge's repository and organization receipts (with the B2 admission checkpoint)
        run: |
          set -euo pipefail
          export STEGVERSE_ORG_LEDGER_ROOT="git+$GITHUB_WORKSPACE#$LEDGER_REF"
          export STEGVERSE_REPO_LEDGER_ROOT="git+$GITHUB_WORKSPACE#$LEDGER_REF:$REPO_LEDGER_NAMESPACE"
          python3 resident-runtime/merge_transfer_admission.py append --commits-file "$RUNNER_TEMP/results/commits.txt" \
            --out "$RUNNER_TEMP/results/append.json"

      - name: Publish the ledger ref (fast-forward only)
        run: |
          if ! git push origin "$LEDGER_REF:$LEDGER_REF"; then
            echo '{"disposition":"FAIL_CLOSED","failure_code":"ORGANIZATION_LEDGER_PUBLISH_RACE","failed_predicate":"PUBLISHED_REF_FAST_FORWARDS","required_evidence_or_repair":"another append moved the ref first; this run published nothing","retry_entrypoint":".github/workflows/organization-ledger-writer.yml (re-run the push)","owning_existing_goal":"StegVerse-org/.github#162","next_attempt":"re-run; a merge already ledgered is answered from the ledger"}'
            exit 1
          fi

      - name: Verify each transfer from a fresh fetch of the published ref
        run: |
          set -euo pipefail
          fresh="$RUNNER_TEMP/readback.git"
          git init -q --bare "$fresh"
          auth_header=$(git config --local --get http.https://github.com/.extraheader || true)
          if [ -z "$auth_header" ]; then
            echo '{"disposition":"FAIL_CLOSED","failure_code":"LEDGER_READBACK_UNAVAILABLE","failed_predicate":"FRESH_FETCH_HAS_CREDENTIALS","required_evidence_or_repair":"checkout credentials unavailable for an independent ref fetch","retry_entrypoint":".github/workflows/organization-ledger-writer.yml","owning_existing_goal":"StegVerse-org/.github#162","next_attempt":"re-run with repository contents permission"}'
            exit 1
          fi
          git --git-dir="$fresh" -c "http.https://github.com/.extraheader=$auth_header" fetch -q "$(git remote get-url origin)" "+$LEDGER_REF:$LEDGER_REF"
          export STEGVERSE_ORG_LEDGER_ROOT="git+$fresh#$LEDGER_REF"
          export STEGVERSE_REPO_LEDGER_ROOT="git+$fresh#$LEDGER_REF:$REPO_LEDGER_NAMESPACE"
          python3 resident-runtime/merge_transfer.py verify --commits-file "$RUNNER_TEMP/results/commits.txt" \
            --out "$RUNNER_TEMP/results/verify.json"
          { echo '### main merge transfer'; echo '```json'; cat "$RUNNER_TEMP/results/verify.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: "Admission checkpoint (B2): each merged head is the admitted head, read back from the published ref"
        run: |
          set -euo pipefail
          fresh="$RUNNER_TEMP/readback.git"
          export STEGVERSE_ORG_LEDGER_ROOT="git+$fresh#$LEDGER_REF"
          export STEGVERSE_REPO_LEDGER_ROOT="git+$fresh#$LEDGER_REF:$REPO_LEDGER_NAMESPACE"
          rc=0
          python3 resident-runtime/merge_transfer_admission.py checkpoint --commits-file "$RUNNER_TEMP/results/commits.txt" \
            --out "$RUNNER_TEMP/results/admission-checkpoint.json" > /dev/null || rc=$?
          { echo '### admission checkpoint (B2)'; echo '```json'; cat "$RUNNER_TEMP/results/admission-checkpoint.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: Retain the run's evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: main-merge-transfer-${{ github.sha }}
          path: ${{ runner.temp }}/results

  # Folded from .github/workflows/intr-path-transfer.yml (job `append`).
  # A transfer over a declared InTr mesh path is a state transition within this
  # organization. Landing a row of .stegverse/intr-path-transfer/transfers.json on
  # main is the transition; the push that lands it is ledgered first by
  # organization-ledger-merge-transfer.yml, and this writer runs when that
  # workflow completes for a push to main (workflow_run: an event of the push,
  # not a dispatch; there is no workflow_dispatch, schedule or cross-repository
  # call). Each declared transfer not yet ledgered gets one repository receipt and
  # one organization receipt (operation INTR_MESH_PATH_TRANSFER) through the
  # existing two-level append, at the supplied epoch on the ledger head (no clock),
  # linked to the push's main-merge transfer receipt. A transfer already ledgered
  # is answered from the ledger. Path receipts are verified by
  # resident-runtime/intr_path_transfer.py verify on a fresh fetch of the
  # published ref; the destination half stays FAIL_CLOSED class B until a carrier
  # and a TV/TVC-issued cross-organization read credential exist.
  #
  # Writer only. The PR-facing checks are intr-path-transfer-validation.yml.
  path-transfer:
    needs: [merge-transfer]
    if: needs.merge-transfer.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      LEDGER_REF: refs/stegverse/organization-ledger
      TRANSFER_COMMIT: ${{ github.sha }}
    steps:
      - name: Checkout the pushed commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Bind the designated organization ledger ref and the repository ledger subtree
        run: |
          set -euo pipefail
          namespace=$(python3 -c 'import json; l=json.load(open(".stegverse/transition-ledger/contract.json"))["repository_ledger_location"]; assert l["ref"]=="refs/stegverse/organization-ledger", l; print(l["namespace"])')
          echo "REPO_LEDGER_NAMESPACE=$namespace" >> "$GITHUB_ENV"
          git fetch --no-tags origin "+$LEDGER_REF:$LEDGER_REF"
          echo "ledger tip: $(git rev-parse "$LEDGER_REF")"
          mkdir -p "$RUNNER_TEMP/results"

      - name: Append each declared path transfer, linked to this push's main-merge transfer
        run: |
          set -euo pipefail
          export STEGVERSE_ORG_LEDGER_ROOT="git+$GITHUB_WORKSPACE#$LEDGER_REF"
          export STEGVERSE_REPO_LEDGER_ROOT="git+$GITHUB_WORKSPACE#$LEDGER_REF:$REPO_LEDGER_NAMESPACE"
          python3 resident-runtime/intr_path_transfer.py append --transfer-commit "$TRANSFER_COMMIT" \
            --out "$RUNNER_TEMP/results/append.json"

      - name: Publish the ledger ref (fast-forward only)
        run: |
          if ! git push origin "$LEDGER_REF:$LEDGER_REF"; then
            echo '{"disposition":"FAIL_CLOSED","failure_code":"ORGANIZATION_LEDGER_PUBLISH_RACE","failed_predicate":"PUBLISHED_REF_FAST_FORWARDS","required_evidence_or_repair":"another append moved the ref first; this run published nothing","retry_entrypoint":".github/workflows/organization-ledger-writer.yml (re-run)","owning_existing_goal":"StegVerse-org/.github#162","next_attempt":"re-run; a ledgered path transfer is answered from the ledger"}'
            exit 1
          fi

      - name: Verify each path from a fresh fetch of the published ref
        run: |
          set -euo pipefail
          fresh="$RUNNER_TEMP/readback.git"
          git init -q --bare "$fresh"
          auth_header=$(git config --local --get http.https://github.com/.extraheader || true)
          if [ -z "$auth_header" ]; then
            echo '{"disposition":"FAIL_CLOSED","failure_code":"LEDGER_READBACK_UNAVAILABLE","failed_predicate":"FRESH_FETCH_HAS_CREDENTIALS","required_evidence_or_repair":"checkout credentials unavailable for an independent ref fetch","retry_entrypoint":".github/workflows/organization-ledger-writer.yml","owning_existing_goal":"StegVerse-org/.github#162","next_attempt":"re-run with repository contents permission"}'
            exit 1
          fi
          git --git-dir="$fresh" -c "http.https://github.com/.extraheader=$auth_header" fetch -q "$(git remote get-url origin)" "+$LEDGER_REF:$LEDGER_REF"
          export STEGVERSE_ORG_LEDGER_ROOT="git+$fresh#$LEDGER_REF"
          export STEGVERSE_REPO_LEDGER_ROOT="git+$fresh#$LEDGER_REF:$REPO_LEDGER_NAMESPACE"
          python3 resident-runtime/intr_path_transfer.py verify --expect-source ALLOW --out "$RUNNER_TEMP/results/verify.json" > /dev/null
          python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); print(json.dumps(r["counts"]))' "$RUNNER_TEMP/results/verify.json"

      - name: Retain the run's evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: intr-path-transfer-${{ github.sha }}
          path: ${{ runner.temp }}/results

  # Folded from .github/workflows/intr-path-ingress.yml (job `append`).
  # The destination half of an InTr mesh path. A row of
  # .stegverse/intr-path-transfer/inbound.json landing on this organization's main
  # carries copies of a source organization's sealed path receipts; landing it is
  # the transition. This writer runs when organization-ledger-merge-transfer.yml
  # completes for that push (workflow_run: an event of the push, not a dispatch;
  # no workflow_dispatch, schedule or cross-repository call). Each carried pair
  # that is sealed, linked and names this destination is consumed by
  # resident-runtime/intr_path_ingress.py through the destination ingress
  # two-level append (operation ORGANIZATION_INTR_DESTINATION_INGRESS, supplied
  # epoch on the ledger head, no clock); the receipts carry both source seals. A
  # row already ledgered is answered from the ledger. The carried pair's inclusion
  # in the source ledger is observed through an anonymous read of the source
  # organization's public ledger (tools/tasks/intr_public_ledgers.sh: no token, no
  # credential helper, no auth header; every organization's .github is public).
  # The read is the job's only network step; the verifier reads the local copy.
  # A row whose source cannot be read is FAIL_CLOSED with the six fields and
  # nothing is written for it.
  #
  # Writer only. The PR-facing checks are intr-path-transfer-validation.yml.
  path-ingress:
    needs: [merge-transfer, path-transfer]
    if: ${{ !cancelled() && needs.merge-transfer.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      LEDGER_REF: refs/stegverse/organization-ledger
    steps:
      - name: Checkout the pushed commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Bind the designated organization ledger ref and the repository ledger subtree
        run: |
          set -euo pipefail
          namespace=$(python3 -c 'import json; l=json.load(open(".stegverse/transition-ledger/contract.json"))["repository_ledger_location"]; assert l["ref"]=="refs/stegverse/organization-ledger", l; print(l["namespace"])')
          echo "REPO_LEDGER_NAMESPACE=$namespace" >> "$GITHUB_ENV"
          git fetch --no-tags origin "+$LEDGER_REF:$LEDGER_REF"
          echo "ledger tip: $(git rev-parse "$LEDGER_REF")"
          mkdir -p "$RUNNER_TEMP/results"

      - name: Consume each inbound row through the destination ingress
        run: |
          set -euo pipefail
          if [ ! -f .stegverse/intr-path-transfer/inbound.json ]; then
            echo "no inbound rows; no transition"; echo "NO_INBOUND=1" >> "$GITHUB_ENV"; exit 0
          fi
          export STEGVERSE_ORG_LEDGER_ROOT="git+$GITHUB_WORKSPACE#$LEDGER_REF"
          export STEGVERSE_REPO_LEDGER_ROOT="git+$GITHUB_WORKSPACE#$LEDGER_REF:$REPO_LEDGER_NAMESPACE"
          # Source inclusion: an anonymous read of each source organization's public ledger (no token).
          bash tools/tasks/intr_public_ledgers.sh "$RUNNER_TEMP/public-ledgers"
          export STEGVERSE_INTR_PUBLIC_LEDGERS="$RUNNER_TEMP/public-ledgers"
          python3 resident-runtime/intr_path_ingress.py consume --out "$RUNNER_TEMP/results/consume.json"

      - name: Publish the ledger ref (fast-forward only)
        if: env.NO_INBOUND != '1'
        run: |
          if ! git push origin "$LEDGER_REF:$LEDGER_REF"; then
            echo '{"disposition":"FAIL_CLOSED","failure_code":"ORGANIZATION_LEDGER_PUBLISH_RACE","failed_predicate":"PUBLISHED_REF_FAST_FORWARDS","required_evidence_or_repair":"another append moved the ref first; this run published nothing","retry_entrypoint":".github/workflows/organization-ledger-writer.yml (re-run)","owning_existing_goal":"StegVerse-org/.github#162","next_attempt":"re-run; a ledgered inbound row is answered from the ledger"}'
            exit 1
          fi

      - name: Verify each inbound row from a fresh fetch of the published ref
        if: env.NO_INBOUND != '1'
        run: |
          set -euo pipefail
          fresh="$RUNNER_TEMP/readback.git"
          git init -q --bare "$fresh"
          auth_header=$(git config --local --get http.https://github.com/.extraheader || true)
          if [ -z "$auth_header" ]; then
            echo '{"disposition":"FAIL_CLOSED","failure_code":"LEDGER_READBACK_UNAVAILABLE","failed_predicate":"FRESH_FETCH_HAS_CREDENTIALS","required_evidence_or_repair":"checkout credentials unavailable for an independent ref fetch","retry_entrypoint":".github/workflows/organization-ledger-writer.yml","owning_existing_goal":"StegVerse-org/.github#162","next_attempt":"re-run with repository contents permission"}'
            exit 1
          fi
          git --git-dir="$fresh" -c "http.https://github.com/.extraheader=$auth_header" fetch -q "$(git remote get-url origin)" "+$LEDGER_REF:$LEDGER_REF"
          export STEGVERSE_ORG_LEDGER_ROOT="git+$fresh#$LEDGER_REF"
          export STEGVERSE_REPO_LEDGER_ROOT="git+$fresh#$LEDGER_REF:$REPO_LEDGER_NAMESPACE"
          python3 resident-runtime/intr_path_ingress.py verify --out "$RUNNER_TEMP/results/verify.json" > /dev/null
          python3 -c 'import json,sys; [print(r["disposition"], r["path_id"]) for r in json.load(open(sys.argv[1]))]' "$RUNNER_TEMP/results/verify.json"

      - name: Retain the run's evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: intr-path-ingress-${{ github.sha }}
          path: ${{ runner.temp }}/results

  # Folded from .github/workflows/organization-ledger-transition.yml (job `transition`).
  # Action by manifest: a transition request committed under
  # .stegverse/transition-requests/ is built into an SDK manifest, received on
  # this organization's ingress, appended to the organization ledger on the
  # designated ref (org-contract.json organization_ledger_ref), published by a
  # fast-forward-only push, and read back from a fresh fetch. The ledger is the
  # evidence; this run's success is not.
  #
  # mode=self-closure is retired: addressing this organization's own
  # intr-destination is an InTr hop inside one organization, and InTr paths exist
  # only between distinct organizations (Rigel's rule, 2026-10-25; SV-LLM/.github#62
  # removed the same steps). Its two steps are removed; a ledger head's supplied
  # epoch is carried by a committed transition request or, in an organization
  # without one, a committed epoch packet, never by a self-closure.
  # Authority and time are constraint variables. The disposition is transition
  # evidence only.
  # ORGANIZATION_LEDGER_LOCK: one appender at a time. The push below is the
  # compare-and-swap against the published ref, so a writer that lost a race
  # fails closed instead of overwriting.
  ledger-transition:
    needs: [plan, merge-transfer, path-transfer, path-ingress]
    if: ${{ !cancelled() && needs.plan.outputs.ledger-transition == 'true' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      LEDGER_REF: refs/stegverse/organization-ledger
      # A push runs the committed-request mode. A dispatch names its mode.
      MODE: ${{ github.event.inputs.mode || 'request' }}
      HB_EPOCH: ${{ github.event.inputs.hb_epoch }}
    steps:
      - name: Checkout organization boundary
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # The post-migration SDK (StegVerse-SDK#452/#466): a request is derived
      # with ORGANIZATION_LEDGER as custody/replay authority and Master Records
      # as the non-gating downstream recorder. The pin before it (e6785196)
      # still derived MASTER_RECORDS as custody authority. Every workflow here
      # pins the same commit, so a request is returned on the SDK it was
      # received under (organization-governance-return.yml).
      # This pin (StegVerse-SDK#502/#503/#504/#517) also carries the remediation fork of
      # every non-ALLOW, with its calculated route; a request received under
      # the previous pin (e8a34b6d) names it as sdk_ref on its return.
      - name: Checkout exact merged SDK manifest state-transition runtime
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: StegVerse-org/StegVerse-SDK
          ref: 74d9b473aa415b06a9d550c28b2779a691b4ba32
          path: sdk
          persist-credentials: false

      - name: Install SDK
        run: python -m pip install --no-deps -e ./sdk

      - name: Validate committed request and readback implementation before any append
        run: |
          trap 'echo '"'"'{"disposition":"FAIL_CLOSED","failure_code":"ORGANIZATION_LEDGER_CONTRACT_OR_REQUEST_INVALID","failed_predicate":"CONTRACTS_BIND_THE_DESIGNATED_REF_AND_EVERY_REQUEST_CARRIES_ONE_MANIFEST_FORM","required_evidence_or_repair":"org-contract.json and contract.json name StegVerse-org/.github refs/stegverse/organization-ledger with a repository subtree, the readback and ingress sources compile, and every committed transition request declares owning_existing_goal, standing and exactly one of build_manifest or manifest; nothing was appended","retry_entrypoint":".github/workflows/organization-ledger-writer.yml","owning_existing_goal":"StegVerse-org/.github#162 P0-runtime-and-custody","next_attempt":"commit the repaired contract or a successor transition request, then run again","consequence_committed":false}'"'"' >&2' ERR
          python -m py_compile resident-runtime/organization_ledger_readback.py \
            resident-runtime/intr_destination_ingress.py
          python - <<'PY'
          import json
          from pathlib import Path
          contract = json.loads(Path(".stegverse/transition-ledger/org-contract.json").read_text())
          assert contract["organization_ledger_repository"] == "StegVerse-org/.github"
          assert contract["organization_ledger_ref"] == "refs/stegverse/organization-ledger"
          # The repository ledger lives in a subtree of the same designated ref
          # (contract.json repository_ledger_location); no second ref is named.
          location = json.loads(Path(".stegverse/transition-ledger/contract.json").read_text())["repository_ledger_location"]
