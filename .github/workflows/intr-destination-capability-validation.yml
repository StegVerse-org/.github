name: Validate InTr Destination Capability

on:
  pull_request:
    branches: [main]
    paths:
      - 'org-boundary/runtime/capability_ingress.py'
      - 'org-boundary/registry/services.json'
      - 'org-kernel/kernel.py'
      - 'org-runtime/interlock-intr.json'
      - 'org-runtime/runtime_boundary.py'
      - 'resident-runtime/intr_destination_ingress.py'
      - 'resident-runtime/organization_egress_boundary.py'
      - 'tests/test_intr_destination_capability.py'
      - 'docs/INTR_DESTINATION_CAPABILITY_MIRROR_HANDOFF.md'
      - '.github/workflows/intr-destination-capability-validation.yml'
      - 'data/intr-protocol/v1/protocol.json'
      - 'org-runtime/intr_protocol.py'
      - 'tests/test_intr_protocol_conformance.py'
      - 'tests/test_intr_protocol_conformance_merge_transfer.py'
      - 'tests/test_intr_protocol_conformance_merge_transfer_gitstore.py'
      - 'tests/fixtures/intr-protocol/**'
      - 'docs/INTR_PROTOCOL_V1.md'
  push:
    branches: [main]
    paths:
      - 'org-boundary/runtime/capability_ingress.py'
      - 'org-boundary/registry/services.json'
      - 'org-kernel/kernel.py'
      - 'org-runtime/interlock-intr.json'
      - 'org-runtime/runtime_boundary.py'
      - 'resident-runtime/intr_destination_ingress.py'
      - 'resident-runtime/organization_egress_boundary.py'
      - 'tests/test_intr_destination_capability.py'
      - 'docs/INTR_DESTINATION_CAPABILITY_MIRROR_HANDOFF.md'
      - '.github/workflows/intr-destination-capability-validation.yml'
      - 'data/intr-protocol/v1/protocol.json'
      - 'org-runtime/intr_protocol.py'
      - 'tests/test_intr_protocol_conformance.py'
      - 'tests/test_intr_protocol_conformance_merge_transfer.py'
      - 'tests/test_intr_protocol_conformance_merge_transfer_gitstore.py'
      - 'tests/fixtures/intr-protocol/**'
      - 'docs/INTR_PROTOCOL_V1.md'

permissions:
  contents: read

jobs:
  validate-intr-destination:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout organization boundary
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: The boundary enforces the advertised address and the served set
        run: |
          python org-runtime/runtime_boundary.py validate > boundary.json
          python - <<'PY'
          import json
          report = json.load(open("boundary.json"))
          assert report["valid"] is True, report["checks"]
          assert report["checks"]["capability_addresses_resolve"] is True
          assert report["checks"]["peer_capability_addresses_derive"] is True
          print("INTR_DESTINATION_ADDRESS_ENFORCED=PASS", len(report["checks"]), "checks")
          PY

      # Both ledgers are durable sovereign state. A run that appended into
      # either default location would be writing runtime reality from CI.
      # The mesh the unittest opens is a temporary directory, not an operator mesh.
      # The far side is this repository's kernel receipt and control response.
      # That proves emit and close against a fabricated answer. It does not
      # prove a live peer installed the capability.
      - name: Validate advertise, address, resolve, emit, and close
        env:
          STEGVERSE_REPO_LEDGER_ROOT: ${{ runner.temp }}/repo-ledger
          STEGVERSE_ORG_LEDGER_ROOT: ${{ runner.temp }}/org-ledger
        run: python -m unittest tests.test_intr_destination_capability -v

      # The canonical InTr protocol v1 contract, checked offline against the
      # byte snapshots of the eight organizations' destination documents.
      # Conformance evidence only; not admission, routing or execution authority.
      - name: Validate InTr protocol v1 conformance across the mesh snapshot
        run: |
          python -m unittest tests.test_intr_protocol_conformance tests.test_intr_protocol_conformance_merge_transfer tests.test_intr_protocol_conformance_merge_transfer_gitstore -v
          python org-runtime/intr_protocol.py mesh --manifest tests/fixtures/intr-protocol/destinations/manifest.json --merge-transfer tests/fixtures/intr-protocol/merge-transfer/manifest.json > mesh.json
          python - <<'PY'
          import json
          r = json.load(open("mesh.json"))
          # 16 organizations (federation.json); 8 do not install the receiving operation (class B).
          assert r["counts"] == {"ALLOW": 8, "DENY": 0, "FAIL_CLOSED": 8}, r["counts"]
          for row in r["results"]:
              print(" ", row["subject"]["organization"], row["disposition"], row.get("failure_code", ""), row.get("failed_predicate", ""))
          print("INTR_PROTOCOL_V1_MESH", json.dumps(r["counts"], sort_keys=True), r["report_digest"])
          # Separate dimension: a main merge is a VERIFIED transfer only with a sealed, linked ledger receipt.
          print("INTR_PROTOCOL_V1_MERGE_TRANSFER", json.dumps(r["merge_transfer"]["counts"], sort_keys=True))
          for row in r["merge_transfer"]["results"]:
              print(" ", row["subject"]["repository"], row["subject"]["merge_commit"][:8], row["disposition"], row.get("failure_code", ""))
          PY
          # StegVerse-Labs and GCAT-BCAT-Engine: pinned to merge_transfer_gitstore.py verify (mode dual).
          python - <<'PY'
          import importlib.util, json
          spec = importlib.util.spec_from_file_location("intr", "org-runtime/intr_protocol.py")
          intr = importlib.util.module_from_spec(spec); spec.loader.exec_module(intr)
          d = intr.merge_transfer_dimension("tests/fixtures/intr-protocol/merge-transfer-gitstore/manifest.json")
          assert d["counts"] == {"ALLOW": 0, "DENY": 0, "FAIL_CLOSED": 2}, d["counts"]
          print("INTR_PROTOCOL_V1_MERGE_TRANSFER_GITSTORE", json.dumps(d["counts"], sort_keys=True))
          for row in d["results"]:
              print(" ", row["subject"]["repository"], row["subject"]["merge_commit"][:8], row["disposition"], row["failure_code"])
          PY
