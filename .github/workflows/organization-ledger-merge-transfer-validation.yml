name: Validate Main Merge Transfer

# PR-facing checks for the main-merge transfer writer
# (.github/workflows/organization-ledger-merge-transfer.yml). Read-only: the
# published ledger ref is fetched, copied into a scratch git dir at the same
# ref name, and the writer's own commands run against that copy. Nothing is pushed.
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/organization-ledger-merge-transfer.yml'
      - '.github/workflows/organization-ledger-merge-transfer-validation.yml'
      - '.stegverse/merge-transfer/**'
      - '.stegverse/transition-ledger/**'
      - 'resident-runtime/merge_transfer.py'
      - 'resident-runtime/merge_transfer_range.py'
      - 'resident-runtime/merge_transfer_dry_run_check.py'
      - 'resident-runtime/intr_destination_ingress.py'
      - 'resident-runtime/ledger_gitstore.py'
      - 'resident-runtime/merge_transfer_gitstore.py'
      - 'resident-runtime/aggregate_repo_transition.py'
      - 'resident-runtime/ledger_store.py'
      - 'tests/test_merge_transfer.py'
      - 'tests/test_merge_transfer_range.py'
      - 'tests/test_merge_transfer_dry_run_check.py'
      - 'tests/fixtures/merge-transfer/**'

permissions:
  contents: read

env:
  LEDGER_REF: refs/stegverse/organization-ledger

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout organization boundary (full history)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Fetch the ledger ref read-only (the fixtures pin a commit on it)
        run: git fetch --no-tags origin "+$LEDGER_REF:$LEDGER_REF"

      - name: Append, verify, refuse (temp ledgers from the pinned tip)
        run: python3 -m unittest tests.test_merge_transfer tests.test_merge_transfer_range tests.test_merge_transfer_dry_run_check -v

  dry-run:
    runs-on: ubuntu-latest
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Checkout organization boundary (full history)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Copy the published ledger into a scratch git dir at the declared ref
        # The writers hold both halves to the declared ref name (resident-runtime/ledger_gitstore.py
        # preflight, through intr_destination_ingress._append), so the copy keeps that name in a scratch
        # bare git dir instead of a second ref name in the workspace. It is never pushed.
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+$LEDGER_REF:$LEDGER_REF"
          published=$(git rev-parse "$LEDGER_REF")
          echo "published ledger tip: $published"
          mkdir -p "$RUNNER_TEMP/results"
          echo "$published" > "$RUNNER_TEMP/results/published-tip"
          scratch="$RUNNER_TEMP/scratch-ledger.git"
          git init -q --bare "$scratch"
          git --git-dir="$scratch" fetch -q "$GITHUB_WORKSPACE" "+$LEDGER_REF:$LEDGER_REF"
          namespace=$(python3 -c 'import json; print(json.load(open(".stegverse/transition-ledger/contract.json"))["repository_ledger_location"]["namespace"])')
          {
            echo "SCRATCH=$scratch"
            echo "STEGVERSE_ORG_LEDGER_ROOT=git+$scratch#$LEDGER_REF"
            echo "STEGVERSE_REPO_LEDGER_ROOT=git+$scratch#$LEDGER_REF:$namespace"
          } >> "$GITHUB_ENV"
          export STEGVERSE_ORG_LEDGER_ROOT="git+$scratch#$LEDGER_REF"
          export STEGVERSE_REPO_LEDGER_ROOT="git+$scratch#$LEDGER_REF:$namespace"
          python3 resident-runtime/merge_transfer_range.py --before "$BASE_SHA" --after "$BASE_SHA" \
            --pending .stegverse/merge-transfer/pending.json > "$RUNNER_TEMP/results/commits.txt"
          cat "$RUNNER_TEMP/results/commits.txt"
          test -s "$RUNNER_TEMP/results/commits.txt"

      - name: "Real state, read-only: each selected merge is VERIFIED or FAIL_CLOSED with six fields, never DENY"
        run: |
          set -euo pipefail
          # a mix of ledgered and unledgered merges is expected, so verify may exit 1; any other status is a failure
          rc=0
          python3 resident-runtime/merge_transfer.py verify \
            --commits-file "$RUNNER_TEMP/results/commits.txt" --out "$RUNNER_TEMP/results/real-state.json" > /dev/null || rc=$?
          test "$rc" -le 1
          python3 resident-runtime/merge_transfer_dry_run_check.py "$RUNNER_TEMP/results/real-state.json"

      - name: The writer's append on the scratch copy, then VERIFIED, then an idempotent replay
        run: |
          set -euo pipefail
          python3 resident-runtime/merge_transfer.py append --commits-file "$RUNNER_TEMP/results/commits.txt" \
            --out "$RUNNER_TEMP/results/append.json"
          python3 resident-runtime/merge_transfer.py verify --commits-file "$RUNNER_TEMP/results/commits.txt" \
            --out "$RUNNER_TEMP/results/verify.json"
          tip=$(git --git-dir="$SCRATCH" rev-parse "$LEDGER_REF")
          python3 resident-runtime/merge_transfer.py append --commits-file "$RUNNER_TEMP/results/commits.txt" \
            --out "$RUNNER_TEMP/results/replay.json"
          test "$(git --git-dir="$SCRATCH" rev-parse "$LEDGER_REF")" = "$tip"
          python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); assert all(x["replayed"] is True for x in r), r' "$RUNNER_TEMP/results/replay.json"
          # the published ref is untouched by this run: still the tip copied at the start, in the workspace too
          test "$(git ls-remote origin "$LEDGER_REF" | cut -f1)" = "$(cat "$RUNNER_TEMP/results/published-tip")"
          test "$(git rev-parse "$LEDGER_REF")" = "$(cat "$RUNNER_TEMP/results/published-tip")"
          { echo '### dry run (scratch git dir, not published)'; echo '```json'; cat "$RUNNER_TEMP/results/verify.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
