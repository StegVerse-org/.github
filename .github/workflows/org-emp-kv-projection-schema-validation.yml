name: Org-Emp-KV Projection Schema Validation

# No schedule and no manual dispatch: the pull_request event at the exact head
# is the only trigger.
on:
  pull_request:
    branches: [main]
    paths:
      - 'orchestration/schemas/org-emp-kv-projection.v1.schema.json'
      - 'tests/test_org_emp_kv_projection_schema.py'
      - '.github/workflows/org-emp-kv-projection-schema-validation.yml'

permissions:
  contents: read

jobs:
  validate-schema:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validate the proposed Org-Emp-KV projection schema (stdlib only)
        run: python -m unittest tests.test_org_emp_kv_projection_schema -v
