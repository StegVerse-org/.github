name: Validate SDK Manifest Crossing of the Organization Boundary

# Nothing in the ecosystem exercised SDK output and boundary transport together.
# The SDK gated its manifests, this boundary gated its crossing, and the join
# between them was gated by nothing -- so a change on either side could break
# it while every check on both sides stayed green. That is how SDK manifests
# came to declare a far side that nothing could reach.
#
# This job installs the SDK at a pinned commit, rebuilds the committed manifest
# fixtures from their build spec, proves they are byte-for-byte what the SDK
# produces, and carries a freshly built manifest across the boundary in the
# same run.

on:
  pull_request:
    branches: [main]
    paths:
      - 'resident-runtime/sdk_manifest_crossing.py'
      - 'tests/test_sdk_manifest_crossing.py'
      - 'tests/test_sdk_manifest_crossing_fidelity.py'
      - 'tests/fixtures/sdk_manifest_fixture_build.py'
      - 'tests/fixtures/sdk-manifest-build-spec.json'
      - 'tests/fixtures/sdk-manifests/**'
      - 'tests/fixtures/d6-far-side-non-allow.json'
      - 'tests/fixtures/d6_far_side_registry.py'
      - 'tests/test_sdk_manifest_crossing_six_fields.py'
      - 'resident-runtime/task_registry_disclosure_endpoint.py'
      - 'tests/test_task_registry_disclosure_endpoint.py'
      - 'orchestration/task-registry.json'
      - 'org-boundary/runtime/intr_transport.py'
      - 'org-boundary/runtime/process_boundary.py'
      - 'org-boundary/runtime/manifest_selection.py'
      - 'org-boundary/registry/services.json'
      - '.github/workflows/sdk-manifest-crossing-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-sdk-manifest-crossing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout organization boundary
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout the SDK that produces the manifests
        uses: actions/checkout@v4
        with:
          repository: StegVerse-org/StegVerse-SDK
          ref: 0028cab992629414b4dda423dffb35c07eaf0771
          path: sdk
          persist-credentials: false

      - name: Install the SDK
        run: python -m pip install -e ./sdk

      - name: Crossing runs without the SDK, and must keep doing so
        run: python -m unittest tests.test_sdk_manifest_crossing -v

      - name: A manifest's declared capability is actually served at the far side
        run: python -m unittest tests.test_task_registry_disclosure_endpoint -v

      - name: The committed fixtures are what the SDK builds, and both sides agree where they go
        run: python -m unittest tests.test_sdk_manifest_crossing_fidelity -v

      - name: Report any fixture drift by name
        run: python tests/fixtures/sdk_manifest_fixture_build.py

      - name: Carry an SDK-built manifest across the boundary end-to-end
        run: |
          python - <<'PY'
          import hashlib, importlib.util, json
          from pathlib import Path

          def load(name, path):
              spec = importlib.util.spec_from_file_location(name, path)
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              return module

          builder = load("build", "tests/fixtures/sdk_manifest_fixture_build.py")
          bridge = load("crossing", "resident-runtime/sdk_manifest_crossing.py")

          manifest = builder.rebuild()["governance-to-boundary-diagnostic"]
          # An ingress manifest declares no chain position, so the crossing is
          # given one. There is no default: a crossing with no standing fails
          # closed at the boundary.
          standing = json.loads(Path("tests/fixtures/crossing-standing-genesis.json").read_text())
          registry = json.loads(Path("org-boundary/registry/services.json").read_text())
          result = bridge.cross(manifest, registry=registry, standing=standing,
                                packet_id="ci-sdk-built-manifest-crossing")
          assert result["crossing_completed"] is True, result
          assert result["consumed"] is True
          assert result["reconstruction"] == "RECONSTRUCTED"
          assert result["receipts"] == ["INGRESS_ACCEPTED", "DISPATCHED", "CONSUMED",
                                        "RESULT_BOUND", "EGRESS_EMITTED"]
          assert result["authority_effect"] == "NONE"
          # The governance processor binds the request the manifest carries,
          # so the far side is bound to the manifest by that request's digest.
          assert result["resolved_service_id"] == "stegverse-org.governance", result
          far = result["egress"]["payload"]["execution_result"]["application_result"]
          request = manifest["extensions"]["stegverse_governance_request"]
          canon = json.dumps(request, sort_keys=True, separators=(",", ":"), ensure_ascii=False).encode()
          assert far["governance_request_sha256"] == hashlib.sha256(canon).hexdigest(), \
              "a different governance request arrived"
          # StegCore is a StegVerse-Labs repository: the request is bound for
          # StegVerse-Labs to decide, never decided here.
          assert far["decision_state"] == "REQUESTED_OF_DECIDING_ORGANIZATION", far
          assert far["deciding_organization"] == "StegVerse-Labs", far
          print("SDK_MANIFEST_CROSSES_ORGANIZATION_BOUNDARY=PASS")
          print(result["terminal_receipt_id"])
          PY

      # No organization service admits purpose_bound_worker. Through the
      # organization ingress this pair now fails closed (D7,
      # PROCESSING_SERVICE_NOT_DECLARED_FOR_CONSUMER_ROUTE), asserted in
      # organization-manifest-ingress-validation.yml. The crossing on its own
      # keeps its surface fallback (it holds no route table), and its refusal
      # is now FAIL_CLOSED with the six fields (D6).
      - name: An unadmitted pair the crossing carries alone is refused with the six fields
        run: |
          python resident-runtime/sdk_manifest_crossing.py \
            --registry org-boundary/registry/services.json \
            --manifest tests/fixtures/sdk-manifests/unadmitted-capability-to-llm-adapter.json \
            --standing tests/fixtures/crossing-standing-genesis.json \
            --packet-id ci-sdk-manifest-crossing-gap --out /tmp/gap.json || true
          python -c 'import json; x=json.load(open("/tmp/gap.json")); six=("failure_code","failed_predicate","required_evidence_or_repair","retry_entrypoint","owning_existing_goal","next_attempt"); assert x["crossing_completed"] is False; assert x["resolved_service_id"]=="stegverse-org.llm-adapter"; assert x["endpoint_adapter_installed"] is True; assert isinstance(x["far_side_disposition"],str) and x["far_side_disposition"].strip(), "a refused crossing must name its disposition"; assert x["disposition"]=="FAIL_CLOSED", x; assert all(isinstance(x.get(f),str) and x[f].strip() for f in six), x; assert x["failure_code"]=="FAR_SIDE_REFUSED_THE_CROSSING", x; print("UNADMITTED_PAIR_REFUSED_WITH_SIX_FIELDS=PASS")'

      # D6: the far-side branch with an ADMITTED pair. D7 fails the unadmitted
      # pair closed at the ingress, so this fixture is the far-side branch's
      # live trigger: one admits_processing row is added to a copy of the
      # registry, and the far side still does not complete.
      - name: A far side that does not complete answers with the six fields (D6)
        run: |
          for case in receiver-unavailable installed-adapter-refuses; do
            python tests/fixtures/d6_far_side_registry.py --case "$case" --out "/tmp/d6-registry-$case.json"
            python resident-runtime/sdk_manifest_crossing.py \
              --registry "/tmp/d6-registry-$case.json" \
              --manifest tests/fixtures/sdk-manifests/unadmitted-capability-to-llm-adapter.json \
              --standing tests/fixtures/crossing-standing-genesis.json \
              --packet-id "ci-d6-$case" --out "/tmp/d6-$case.json" || true
          done
          python - <<'PY'
          import json
          spec = json.load(open("tests/fixtures/d6-far-side-non-allow.json"))
          six = ("failure_code", "failed_predicate", "required_evidence_or_repair",
                 "retry_entrypoint", "owning_existing_goal", "next_attempt")
          for case, expected in spec["cases"].items():
              x = json.load(open("/tmp/d6-" + case + ".json"))
              assert x["crossing_completed"] is False, (case, x)
              assert x["resolved_service_id"] == expected["admit_on_service"], (case, x)
              assert x["disposition"] == "FAIL_CLOSED", (case, x)
              assert all(isinstance(x.get(f), str) and x[f].strip() for f in six), (case, x)
              assert x["failure_code"] == expected["expected_failure_code"], (case, x)
              assert x["failed_predicate"] == expected["expected_failed_predicate"], (case, x)
              assert x["owning_existing_goal"] == "INTERLOCK-INTR-RUNTIME-INDEPENDENT-PROTOCOL-001"
              assert x["receiver_unavailable_disposition"] == "DURABLE_QUEUE_OR_EVENT_EPHEMERAL_MATERIALIZATION"
              assert x["awaits_the_receiver"] is False
              if "expected_next_attempt_prefix" in expected:
                  assert x["next_attempt"].startswith(expected["expected_next_attempt_prefix"]), x
              print("D6_FAR_SIDE_SIX_FIELDS=PASS", case, x["failure_code"])
          PY
      - name: Every non-ALLOW crossing result carries the six fields (D6)
        run: python -m unittest tests.test_sdk_manifest_crossing_six_fields -v


      - name: The declared capability is served, with a reconstructable chain
        run: |
          python resident-runtime/sdk_manifest_crossing.py \
            --registry org-boundary/registry/services.json \
            --manifest tests/fixtures/sdk-manifests/task-registry-disclosure-to-llm-adapter.json \
            --standing tests/fixtures/crossing-standing-genesis.json \
            --packet-id ci-task-registry-disclosure --out /tmp/disclosure.json
          python -c 'import json; x=json.load(open("/tmp/disclosure.json")); assert x["crossing_completed"] is True; assert x["processing_selection"]=="MANIFEST_DECLARED"; assert x["declared_capability_processed"] is True; assert x["resolved_service_id"]=="stegverse-org.llm-adapter"; assert x["reconstruction"]=="RECONSTRUCTED"; assert len(x["receipts"])==5; r=x["egress"]["payload"]["execution_result"]["application_result"]; assert r["authority_effect"]=="NONE_DISCLOSURE_ONLY"; print("DECLARED_CAPABILITY_SERVED_AT_FAR_SIDE=PASS", r["active_goal"], r["task_count"])'
