name: Validate SDK Manifest Crossing of the Organization Boundary

# Nothing in the ecosystem exercised SDK output and boundary transport together.
# The SDK gated its manifests, this boundary gated its crossing, and the join
# between them was gated by nothing -- so a change on either side could break
# it while every check on both sides stayed green. That is how SDK manifests
# came to declare a far side that nothing could reach.
#
# This job installs the SDK at a pinned commit, rebuilds the committed manifest
# fixtures from their build spec, proves they are byte-for-byte what the SDK
# produces, and carries a freshly built manifest across the boundary in the
# same run.

on:
  pull_request:
    branches: [main]
    paths:
      - 'resident-runtime/sdk_manifest_crossing.py'
      - 'tests/test_sdk_manifest_crossing.py'
      - 'tests/test_sdk_manifest_crossing_fidelity.py'
      - 'tests/fixtures/sdk_manifest_fixture_build.py'
      - 'tests/fixtures/sdk-manifest-build-spec.json'
      - 'tests/fixtures/sdk-manifests/**'
      - 'resident-runtime/task_registry_disclosure_endpoint.py'
      - 'tests/test_task_registry_disclosure_endpoint.py'
      - 'orchestration/task-registry.json'
      - 'org-boundary/runtime/intr_transport.py'
      - 'org-boundary/runtime/process_boundary.py'
      - 'org-boundary/runtime/manifest_selection.py'
      - 'org-boundary/registry/services.json'
      - '.github/workflows/sdk-manifest-crossing-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-sdk-manifest-crossing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout organization boundary
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout the SDK that produces the manifests
        uses: actions/checkout@v4
        with:
          repository: StegVerse-org/StegVerse-SDK
          ref: 0028cab992629414b4dda423dffb35c07eaf0771
          path: sdk
          persist-credentials: false

      - name: Install the SDK
        run: python -m pip install -e ./sdk

      - name: Crossing runs without the SDK, and must keep doing so
        run: python -m unittest tests.test_sdk_manifest_crossing -v

      - name: A manifest's declared capability is actually served at the far side
        run: python -m unittest tests.test_task_registry_disclosure_endpoint -v

      - name: The committed fixtures are what the SDK builds, and both sides agree where they go
        run: python -m unittest tests.test_sdk_manifest_crossing_fidelity -v

      - name: Report any fixture drift by name
        run: python tests/fixtures/sdk_manifest_fixture_build.py

      - name: Carry an SDK-built manifest across the boundary end-to-end
        run: |
          python - <<'PY'
          import importlib.util, json
          from pathlib import Path

          def load(name, path):
              spec = importlib.util.spec_from_file_location(name, path)
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              return module

          builder = load("build", "tests/fixtures/sdk_manifest_fixture_build.py")
          bridge = load("crossing", "resident-runtime/sdk_manifest_crossing.py")

          manifest = builder.rebuild()["governance-to-boundary-diagnostic"]
          # An ingress manifest declares no chain position, so the crossing is
          # given one. There is no default: a crossing with no standing fails
          # closed at the boundary.
          standing = json.loads(Path("tests/fixtures/crossing-standing-genesis.json").read_text())
          result = bridge.cross(manifest, standing=standing,
                                packet_id="ci-sdk-built-manifest-crossing")
          assert result["crossing_completed"] is True, result
          assert result["consumed"] is True
          assert result["reconstruction"] == "RECONSTRUCTED"
          assert result["receipts"] == ["INGRESS_ACCEPTED", "DISPATCHED", "CONSUMED",
                                        "RESULT_BOUND", "EGRESS_EMITTED"]
          assert result["authority_effect"] == "NONE"
          far = result["egress"]["payload"]["execution_result"]["application_result"]["echo"]
          assert far["manifest"] == manifest, "a different manifest arrived"
          assert far["manifest_sha256"] == result["manifest_sha256"]
          print("SDK_MANIFEST_CROSSES_ORGANIZATION_BOUNDARY=PASS")
          print(result["terminal_receipt_id"])
          PY

      - name: An installed far side still refuses a pair it does not admit
        run: |
          python resident-runtime/sdk_manifest_crossing.py \
            --manifest tests/fixtures/sdk-manifests/governance-to-llm-adapter.json \
            --standing tests/fixtures/crossing-standing-genesis.json \
            --packet-id ci-sdk-manifest-crossing-gap --out /tmp/gap.json || true
          python -c 'import json; x=json.load(open("/tmp/gap.json")); assert x["crossing_completed"] is False; assert x["resolved_service_id"]=="stegverse-org.llm-adapter"; assert x["endpoint_adapter_installed"] is True, "this step now covers an installed adapter refusing an unadmitted pair"; assert isinstance(x["far_side_disposition"],str) and x["far_side_disposition"].strip(), "a refused crossing must name its disposition"; print("UNADMITTED_PAIR_REFUSED_AT_INSTALLED_FAR_SIDE=PASS")'

      - name: The declared capability is served, with a reconstructable chain
        run: |
          python resident-runtime/sdk_manifest_crossing.py \
            --manifest tests/fixtures/sdk-manifests/task-registry-disclosure-to-llm-adapter.json \
            --standing tests/fixtures/crossing-standing-genesis.json \
            --packet-id ci-task-registry-disclosure --out /tmp/disclosure.json
          python -c 'import json; x=json.load(open("/tmp/disclosure.json")); assert x["crossing_completed"] is True; assert x["processing_selection"]=="MANIFEST_DECLARED"; assert x["declared_capability_processed"] is True; assert x["resolved_service_id"]=="stegverse-org.llm-adapter"; assert x["reconstruction"]=="RECONSTRUCTED"; assert len(x["receipts"])==5; r=x["egress"]["payload"]["execution_result"]["application_result"]; assert r["authority_effect"]=="NONE_DISCLOSURE_ONLY"; print("DECLARED_CAPABILITY_SERVED_AT_FAR_SIDE=PASS", r["active_goal"], r["task_count"])'
