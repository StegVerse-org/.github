  pull_request:
    paths:
      - 'org-runtime/**'
      - 'resident-runtime/aggregate_repo_transition.py'
      - 'resident-runtime/ledger_store.py'
      - '.stegverse/transition-ledger/emit.py'
      - 'resident-runtime/propagate_repository_receipts.py'
      - 'tests/test_ledger_location_supplied.py'
      - 'resident-runtime/federation_cycle.py'
      - 'tests/test_federation_cycle_propagation_location.py'
      - 'resident-runtime/ecosystem_control.py'
      - 'resident-runtime/activation-manifest.json'
      - 'tests/test_no_hosted_gateway_route.py'
      - 'resident-runtime/resident_executor.py'
      - 'resident-runtime/run_sv002_self_characterization_roundtrip.py'
      - 'resident-runtime/control/sv002-sdk-query.request.json'
      - 'tests/test_resident_materialization.py'
      - '.stegverse/transition-ledger/contract.json'
      - 'tests/test_receipt_time_base.py'
      - 'tests/test_repo_ledger_serialized_append.py'
      - 'tests/test_ledger_store_contract.py'
      - 'tests/test_ledger_substrate_transaction.py'
      - 'tests/test_ledger_substrate_transaction.py'
      - 'org-boundary/runtime/intr_transport.py'
      - 'org-boundary/runtime/process_boundary.py'
      - 'org-boundary/registry/services.json'
      - 'org-boundary/registry/federation.json'
      - 'org-boundary/runtime/federation_projection.py'
      - 'tests/test_federation_projection.py'
      - 'org-kernel/kernel.py'
      - 'org-kernel/node_store.py'
      - 'tests/test_node_store_contract.py'
      - 'tests/test_kernel_node_state_is_addressed.py'
      - 'tests/test_kernel_node_state_supplied.py'
      - 'tests/test_stable_epoch_and_adapter_effects.py'
      - 'tests/test_kernel_crossing_organization_receipts.py'
      - 'tests/test_refused_crossings_recorded.py'
      - 'tests/peer_organization.py'
      - 'resident-runtime/sdk_self_characterization_response.py'
      - 'resident-runtime/submit_org_transition_to_master_records.py'
      - 'resident-runtime/run_once.py'
      - 'resident-runtime/org_boundary_runtime.py'
      - 'resident-runtime/sdk_self_characterization_egress.py'
      - 'resident-runtime/sdk_manifest_crossing.py'
      - 'resident-runtime/task_registry_disclosure_endpoint.py'
      - 'tests/test_sdk_manifest_crossing.py'
      - 'tests/fixtures/sdk-manifests/**'
      - 'tests/test_intr_org_crossing.py'
      - 'tests/test_hb_reference_oscillator.py'
      - 'tests/test_sdk_self_characterization_egress.py'
      - '.stegverse/transition-ledger/org-contract.json'
      - 'data/organization-role-runtime-reality-deployment.json'
      - 'data/organization-role-exemption-register.json'
      - 'docs/ORGANIZATION_ROLE_RUNTIME_REALITY_DEPLOYMENT.md'
      - 'tests/test_org_ledger_atomic_append.py'
      - 'tests/test_org_ledger_predecessor_resolution.py'
      - 'tests/test_organization_role_runtime_reality_deployment.py'
      - 'ORG_RESIDENT_RUNTIME_INTR_BOUNDARY_MIRROR_HANDOFF.md'
      - '.github/workflows/org-runtime-boundary.yml'
  push:
    branches: [main]
    paths:
      - 'org-runtime/**'
      - 'resident-runtime/aggregate_repo_transition.py'
      - 'resident-runtime/ledger_store.py'
      - '.stegverse/transition-ledger/emit.py'
      - 'resident-runtime/propagate_repository_receipts.py'
      - 'tests/test_ledger_location_supplied.py'
      - 'resident-runtime/federation_cycle.py'
      - 'tests/test_federation_cycle_propagation_location.py'
      - 'resident-runtime/ecosystem_control.py'
      - 'resident-runtime/activation-manifest.json'
      - 'tests/test_no_hosted_gateway_route.py'
      - 'resident-runtime/resident_executor.py'
      - 'resident-runtime/run_sv002_self_characterization_roundtrip.py'
      - 'resident-runtime/control/sv002-sdk-query.request.json'
      - 'tests/test_resident_materialization.py'
      - '.stegverse/transition-ledger/contract.json'
      - 'tests/test_receipt_time_base.py'
      - 'tests/test_repo_ledger_serialized_append.py'
      - 'tests/test_ledger_store_contract.py'
      - 'org-boundary/runtime/intr_transport.py'
      - 'org-boundary/runtime/process_boundary.py'
      - 'org-boundary/registry/services.json'
      - 'org-boundary/registry/federation.json'
      - 'org-boundary/runtime/federation_projection.py'
      - 'tests/test_federation_projection.py'
      - 'org-kernel/kernel.py'
      - 'org-kernel/node_store.py'
      - 'tests/test_node_store_contract.py'
      - 'tests/test_kernel_node_state_is_addressed.py'
      - 'tests/test_kernel_node_state_supplied.py'
      - 'tests/test_stable_epoch_and_adapter_effects.py'
      - 'tests/test_kernel_crossing_organization_receipts.py'
      - 'tests/test_refused_crossings_recorded.py'
      - 'tests/peer_organization.py'
      - 'resident-runtime/sdk_self_characterization_response.py'
      - 'resident-runtime/submit_org_transition_to_master_records.py'
      - 'resident-runtime/run_once.py'
      - 'resident-runtime/org_boundary_runtime.py'
      - 'resident-runtime/sdk_self_characterization_egress.py'
      - 'resident-runtime/sdk_manifest_crossing.py'
      - 'resident-runtime/task_registry_disclosure_endpoint.py'
      - 'tests/test_sdk_manifest_crossing.py'
      - 'tests/fixtures/sdk-manifests/**'
      - 'tests/test_intr_org_crossing.py'
      - 'tests/test_hb_reference_oscillator.py'
      - 'tests/test_sdk_self_characterization_egress.py'
      - '.stegverse/transition-ledger/org-contract.json'
      - 'data/organization-role-runtime-reality-deployment.json'
      - 'data/organization-role-exemption-register.json'
      - 'docs/ORGANIZATION_ROLE_RUNTIME_REALITY_DEPLOYMENT.md'
      - 'tests/test_org_ledger_atomic_append.py'
      - 'tests/test_org_ledger_predecessor_resolution.py'
      - 'tests/test_organization_role_runtime_reality_deployment.py'
      - 'ORG_RESIDENT_RUNTIME_INTR_BOUNDARY_MIRROR_HANDOFF.md'
      - '.github/workflows/org-runtime-boundary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test serialized organization ledger append
        run: python -m unittest discover -s tests -p 'test_org_ledger_atomic_append.py' -v
      - name: Test predecessor resolution, explicit genesis and exact source retention
        run: python -m unittest discover -s tests -p 'test_org_ledger_predecessor_resolution.py' -v
      - name: Test organization ledger store contract
        run: python -m unittest tests.test_ledger_store_contract -v
      - name: Test Organization Role deployment and generalized ledger admission
        run: python -m unittest discover -s tests -p 'test_organization_role_runtime_reality_deployment.py' -v
      - name: Test complete Interlock/InTr organization crossing
        run: python -m unittest tests.test_intr_org_crossing -v
      - name: Test SDK self-characterization egress route
        run: python -m unittest tests.test_sdk_self_characterization_egress -v
      - name: Test an SDK manifest crosses the organization boundary to its declared surface
        run: python -m unittest tests.test_sdk_manifest_crossing -v
      - name: Carry a declared SDK manifest across the boundary end-to-end
        run: |
          python resident-runtime/sdk_manifest_crossing.py \
            --registry org-boundary/registry/services.json \
            --manifest tests/fixtures/sdk-manifests/governance-to-boundary-diagnostic.json \
            --standing tests/fixtures/crossing-standing-genesis.json \
            --packet-id ci-sdk-manifest-crossing --out /tmp/sdk-crossing.json
          python -c 'import json; x=json.load(open("/tmp/sdk-crossing.json")); assert x["crossing_completed"] is True; assert x["consumed"] is True; assert x["reconstruction"]=="RECONSTRUCTED"; assert x["authority_effect"]=="NONE"; assert len(x["receipts"])==5'
      - name: An installed far side still refuses a pair it does not admit
        run: |
          python resident-runtime/sdk_manifest_crossing.py \
            --registry org-boundary/registry/services.json \
            --manifest tests/fixtures/sdk-manifests/unadmitted-capability-to-llm-adapter.json \
            --standing tests/fixtures/crossing-standing-genesis.json \
            --packet-id ci-sdk-manifest-crossing-gap --out /tmp/sdk-crossing-gap.json || true
          python -c 'import json; x=json.load(open("/tmp/sdk-crossing-gap.json")); assert x["crossing_completed"] is False; assert x["resolved_service_id"]=="stegverse-org.llm-adapter"; assert x["endpoint_adapter_installed"] is True; assert isinstance(x["far_side_disposition"],str) and x["far_side_disposition"].strip(), "a refused crossing must name its disposition"'

      - name: The declared capability is served at the far side
        run: |
          python resident-runtime/sdk_manifest_crossing.py \
            --registry org-boundary/registry/services.json \
            --manifest tests/fixtures/sdk-manifests/task-registry-disclosure-to-llm-adapter.json \
            --standing tests/fixtures/crossing-standing-genesis.json \
            --packet-id ci-task-registry-disclosure --out /tmp/task-registry-disclosure.json
          python -c 'import json; x=json.load(open("/tmp/task-registry-disclosure.json")); assert x["declared_capability_processed"] is True; assert x["processing_selection"]=="MANIFEST_DECLARED"; assert x["reconstruction"]=="RECONSTRUCTED"; assert len(x["receipts"])==5'
      - name: Test the ledgers are written only where supplied, never under the host home
        run: python -m unittest tests.test_ledger_location_supplied -v
      - name: Test a cycle without a repository ledger home fails propagation closed, not the cycle
        run: python -m unittest tests.test_federation_cycle_propagation_location -v
      - name: Test federation uses the declared carrier only; no host-selected gateway
        run: python -m unittest tests.test_no_hosted_gateway_route -v
      - name: Test the resident executor is one cycle per materialization and SV002 is a submission
        run: python -m unittest tests.test_resident_materialization -v
      - name: Test repository ledger append is serialized and atomically published
        run: python -m unittest tests.test_repo_ledger_serialized_append -v
      - name: Test portable transactional ledger substrate
        run: python -m unittest tests.test_ledger_substrate_transaction -v
      - name: Test canonical receipts are timed by the heartbeat, not a clock
        run: python -m unittest tests.test_receipt_time_base -v
      - name: Test heartbeat reference is an oscillator count, not a clock read
        run: python -m unittest tests.test_hb_reference_oscillator -v
      - name: Test StegOS node-state store contract
        run: python -m unittest tests.test_node_store_contract -v
      - name: Test StegOS node state is addressed, not located
        run: python -m unittest tests.test_kernel_node_state_is_addressed -v
      - name: Test node markers and work intake go only to supplied node state, never the checkout
        run: python -m unittest tests.test_kernel_node_state_supplied -v
      - name: Test replayed effects reproduce rather than repeat, and every adapter declares its effect
        run: python -m unittest tests.test_stable_epoch_and_adapter_effects -v
      - name: Test every consumed crossing is recorded on both ledgers before it is answered
        run: python -m unittest tests.test_kernel_crossing_organization_receipts -v
      - name: Test a refused crossing is recorded as DENY or FAIL_CLOSED, never thrown
        run: python -m unittest tests.test_refused_crossings_recorded -v
      - name: Test organization kernel carrier frame and ingest
        run: python org-kernel/tests/test_kernel.py
      - name: Validate federation directory projection
        run: python org-boundary/runtime/federation_projection.py verify
      - name: Test federation projection refuses drift from the canonical directory
        run: python -m unittest tests.test_federation_projection -v
      - name: Report node-state provenance and refuse a silent host dependency
        run: |
          python - <<'PY'
          import importlib.util, json
          spec = importlib.util.spec_from_file_location("kernel", "org-kernel/kernel.py")
          kernel = importlib.util.module_from_spec(spec); spec.loader.exec_module(kernel)
          supplied = kernel.node_state_provenance("/tmp/ci-stegos-mesh")
          assert supplied["mesh_provenance"] == "SUPPLIED"
          assert supplied["mesh_portable"] is True
          assert supplied["authority_effect"] == "NONE_REPORT_ONLY"
          try:
              kernel.node_state_provenance()
              raise AssertionError("host-derived mesh unexpectedly admitted")
          except ValueError as exc:
              assert "mesh_location_required_from_materializer" in str(exc)
          print(json.dumps(supplied, sort_keys=True))
          print("STEGOS_NODE_STATE_PROVENANCE_REPORTED=PASS")
          PY
      - name: Validate organization boundary
        run: |
          python org-runtime/runtime_boundary.py validate | tee /tmp/org-boundary.json
          python -c 'import json; x=json.load(open("/tmp/org-boundary.json")); assert x["valid"] is True; assert x["authority_effect"]=="NONE_VALIDATION_ONLY"'
      - name: Validate activation request generation
        run: |
          python org-runtime/runtime_boundary.py activation-request --runtime-id validation-resident | tee /tmp/activation.json
          python -c 'import json; x=json.load(open("/tmp/activation.json")); assert x["state"]=="REQUESTED"; assert x["request_granted_authority"] is False; assert x["github_token_runtime_authority"]=="NONE"'
      - name: Validate Interlock/InTr ingress generation
        run: |
          python org-runtime/runtime_boundary.py ingress --peer-org validation-peer --interlock-id validation-interlock --payload-sha256 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef --transition-elements-ref validation-transition-elements | tee /tmp/ingress.json
          python -c 'import json; x=json.load(open("/tmp/ingress.json")); assert x["direction"]=="INGRESS"; assert x["protocol"]=="InTr"; assert x["authority_effect_resolution"]=="DERIVED_FROM_APPLICABLE_TRANSITION_ELEMENTS"'
      - name: Validate Interlock/InTr egress generation
        run: |
          python org-runtime/runtime_boundary.py egress --peer-org validation-peer --interlock-id validation-interlock --payload-sha256 fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210 --transition-elements-ref validation-transition-elements | tee /tmp/egress.json
          python -c 'import json; x=json.load(open("/tmp/egress.json")); assert x["direction"]=="EGRESS"; assert x["protocol"]=="InTr"; assert x["github_token_runtime_authority"]=="NONE"'
