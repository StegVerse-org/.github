name: Organization Ledger Transition

# Action by manifest: a transition request committed under
# .stegverse/transition-requests/ is built into an SDK manifest, received on
# this organization's ingress, appended to the organization ledger on the
# designated ref (org-contract.json organization_ledger_ref), published by a
# fast-forward-only push, and read back from a fresh fetch. The ledger is the
# evidence; this run's success is not.
on:
  push:
    branches: [main]
    paths:
      - '.stegverse/transition-requests/**'
  workflow_dispatch:
    inputs:
      request:
        description: 'Path of a committed transition request'
        required: true
      mesh_root:
        description: 'git+repository#refs/... mesh locator (a committed request may declare mesh_root instead)'
        required: true

permissions:
  contents: write

# ORGANIZATION_LEDGER_LOCK: one appender at a time. The push below is the
# compare-and-swap against the published ref, so a writer that lost a race
# fails closed instead of overwriting.
concurrency:
  group: organization-ledger
  cancel-in-progress: false

jobs:
  transition:
    runs-on: ubuntu-latest
    env:
      LEDGER_REF: refs/stegverse/organization-ledger
    steps:
      - name: Checkout organization boundary
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The post-migration SDK (StegVerse-SDK#452/#466): a request is derived
      # with ORGANIZATION_LEDGER as custody/replay authority and Master Records
      # as the non-gating downstream recorder. The pin before it (e6785196)
      # still derived MASTER_RECORDS as custody authority. Every workflow here
      # pins the same commit, so a request is returned on the SDK it was
      # received under (organization-governance-return.yml).
      # This pin (StegVerse-SDK#502/#503/#504/#517) also carries the remediation fork of
      # every non-ALLOW, with its calculated route; a request received under
      # the previous pin (e8a34b6d) names it as sdk_ref on its return.
      - name: Checkout exact merged SDK manifest state-transition runtime
        uses: actions/checkout@v4
        with:
          repository: StegVerse-org/StegVerse-SDK
          ref: 74d9b473aa415b06a9d550c28b2779a691b4ba32
          path: sdk
          persist-credentials: false

      - name: Install SDK
        run: python -m pip install --no-deps -e ./sdk

      - name: Validate committed request and readback implementation before any append
        run: |
          python -m py_compile resident-runtime/organization_ledger_readback.py
          python - <<'PY'
          import json
          from pathlib import Path
          contract = json.loads(Path(".stegverse/transition-ledger/org-contract.json").read_text())
          assert contract["organization_ledger_repository"] == "StegVerse-org/.github"
          assert contract["organization_ledger_ref"] == "refs/stegverse/organization-ledger"
          # The repository ledger lives in a subtree of the same designated ref
          # (contract.json repository_ledger_location); no second ref is named.
          location = json.loads(Path(".stegverse/transition-ledger/contract.json").read_text())["repository_ledger_location"]
          assert location["repository"] == contract["organization_ledger_repository"]
          assert location["ref"] == contract["organization_ledger_ref"]
          assert location["new_ledger_root"] is False and location["namespace"]
          for path in Path(".stegverse/transition-requests").glob("*.json"):
              request = json.loads(path.read_text())
              assert request["owning_existing_goal"] and request["standing"]
              # Exactly one manifest form: build_manifest arguments, or the exact
              # already-built manifest with its canonical digest.
              assert ("build_manifest" in request) != ("manifest" in request), path
          PY

      - name: Bind the designated organization ledger ref and the repository ledger subtree within it
        run: |
          ref=$(python -c 'import json; c=json.load(open(".stegverse/transition-ledger/org-contract.json")); assert c["organization_ledger_repository"]=="StegVerse-org/.github", c; print(c["organization_ledger_ref"])')
          test "$ref" = "$LEDGER_REF"
          namespace=$(python -c 'import json; l=json.load(open(".stegverse/transition-ledger/contract.json"))["repository_ledger_location"]; assert l["ref"]=="refs/stegverse/organization-ledger", l; print(l["namespace"])')
          echo "REPO_LEDGER_NAMESPACE=$namespace" >> "$GITHUB_ENV"
          echo "repository ledger subtree: $namespace"
          if git ls-remote --exit-code origin "$LEDGER_REF" >/dev/null; then
            git fetch --no-tags origin "+$LEDGER_REF:$LEDGER_REF"
            echo "ledger tip: $(git rev-parse "$LEDGER_REF")"
          else
            echo "ledger ref not yet materialized; the first append opens it at genesis"
          fi

      - name: Select committed transition requests
        env:
          INPUT_REQUEST: ${{ github.event.inputs.request }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$INPUT_REQUEST" ]; then
            # A dispatch may select only an existing, committed transition
            # request from the checked-out revision, never an arbitrary path.
            case "$INPUT_REQUEST" in
              .stegverse/transition-requests/*.json) ;;
              *) echo "FAIL_CLOSED: DISPATCH_REQUEST_OUTSIDE_COMMITTED_TRANSITION_REQUESTS" >&2; exit 1 ;;
            esac
            case "$INPUT_REQUEST" in
              *../*|*/../*|*' '*) echo "FAIL_CLOSED: DISPATCH_REQUEST_PATH_INVALID" >&2; exit 1 ;;
            esac
            # Reject control characters, including newline and carriage return,
            # without interpolating the input into shell source.
            if ! INPUT_REQUEST="$INPUT_REQUEST" python -c 'import os,sys; p=os.environ["INPUT_REQUEST"]; sys.exit(0 if all(32 <= ord(c) <= 126 for c in p) else 1)'; then
              echo "FAIL_CLOSED: DISPATCH_REQUEST_CONTROL_CHARACTER" >&2
              exit 1
            fi
            if ! git ls-files --error-unmatch -- "$INPUT_REQUEST" >/dev/null 2>&1 || [ ! -f "$INPUT_REQUEST" ]; then
              echo "FAIL_CLOSED: DISPATCH_REQUEST_NOT_COMMITTED" >&2
              exit 1
            fi
            printf '%s\n' "$INPUT_REQUEST" > "$RUNNER_TEMP/requests.txt"
          else
            git diff --name-only --diff-filter=AM "$BEFORE" "$GITHUB_SHA" -- '.stegverse/transition-requests/*.json' > "$RUNNER_TEMP/requests.txt"
          fi
          cat "$RUNNER_TEMP/requests.txt"

      - name: Receive each request and append to the repository and organization ledgers
        env:
          INPUT_MESH_ROOT: ${{ github.event.inputs.mesh_root }}
        run: |
          set -euo pipefail
          export STEGVERSE_ORG_LEDGER_ROOT="git+$GITHUB_WORKSPACE#$LEDGER_REF"
          # Same ref, own subtree: the repository chain is published by the same
          # fast-forward push below and survives this run (contract.json
          # repository_ledger_location; StegVerse-org/.github#118).
          export STEGVERSE_REPO_LEDGER_ROOT="git+$GITHUB_WORKSPACE#$LEDGER_REF:$REPO_LEDGER_NAMESPACE"
          mkdir -p "$RUNNER_TEMP/results"
          # A durable mesh locator is supplied, never inferred from environment,
          # runner home, or sovereign ledger ref. Action is by manifest: the
          # committed request that directs this run declares it (mesh_root), and
          # a dispatch input, when given, is used unchanged
          # (resident-runtime/manifest_directed_run_inputs.py). A run whose
          # requests declare none has none: the node is then materialized
          # without a mesh, and a capability that must leave this organization
          # is refused at egress by the ingress itself
          # (mesh_location_required_from_materializer), with all six fields,
          # recorded on both ledgers and read back below. The ledger carries
          # that disposition; this run does not stand in for it.
          mesh_root="$INPUT_MESH_ROOT"
          if ! resolved=$(python resident-runtime/manifest_directed_run_inputs.py transition-mesh \
              --dispatch-mesh-root "$mesh_root" --requests "$RUNNER_TEMP/requests.txt"); then
            echo "$resolved"; exit 1
          fi
          echo "$resolved"
          mesh_root=$(python -c 'import json,sys; print(json.loads(sys.argv[1])["mesh_root"])' "$resolved")
          mesh_args=()
          if [ -n "$mesh_root" ]; then
            # The designated locator names a repository and a ref. This run can
            # publish a ref of its own repository only, so the binding resolves
            # the locator onto the checkout (or refuses with six fields; no
            # credential for another repository is inferred). The mesh ref is
            # fetched here and pushed fast-forward below, so a frame placed on it
            # outlives this run: the mesh is the durable queue.
            if ! binding=$(python resident-runtime/mesh_locator_binding.py \
                --locator "$mesh_root" --repository "$GITHUB_REPOSITORY" --workspace "$GITHUB_WORKSPACE"); then
              echo "$binding"; exit 1
            fi
            echo "$binding"
            mesh_ref=$(python -c 'import json,sys; print(json.loads(sys.argv[1])["publish_ref"])' "$binding")
            if git ls-remote --exit-code origin "$mesh_ref" >/dev/null; then
              git fetch --no-tags origin "+$mesh_ref:$mesh_ref"
              echo "mesh tip: $(git rev-parse "$mesh_ref")"
            else
              echo "mesh ref not yet materialized; the first frame opens it"
            fi
            echo "MESH_PUBLISH_REF=$mesh_ref" >> "$GITHUB_ENV"
            mesh_args=(--mesh-root "git+$GITHUB_WORKSPACE#$mesh_ref")
            echo "mesh supplied: $mesh_root -> ${mesh_args[1]}"
          else
            echo "no mesh declared by the committed requests or dispatched; an emission is refused at egress and the refusal is recorded (SVORG-MESH-LOCATION-BINDING-001)"
          fi
          while IFS= read -r request; do
            [ -n "$request" ] || continue
            name=$(basename "$request" .json)
            # A request whose process the boundary binds to egress leaves this
            # organization, and a run without a supplied mesh can
            # only record its emission as refused. Recording it would also make
            # the manifest one already recorded, so a later dispatch with the
            # mesh would be answered from the ledger and never emit: the request
            # would be spent by the push that merged it. Without a mesh it is
            # deferred to the request or dispatch that supplies one; nothing is received,
            # recorded or spent here.
            if [ ${#mesh_args[@]} -eq 0 ] && python - "$request" <<'PY'
          import importlib.util, json, sys
          spec = importlib.util.spec_from_file_location("inputs", "resident-runtime/manifest_directed_run_inputs.py")
          inputs = importlib.util.module_from_spec(spec); spec.loader.exec_module(inputs)
          request = json.load(open(sys.argv[1]))
          egress = json.load(open("org-runtime/interlock-intr.json")).get("egress") or {}
          bound = {b.get("profile_id") for b in egress.get("capability_destination_bindings") or [] if isinstance(b, dict)}
          sys.exit(0 if inputs.request_process(request) in bound else 1)
          PY
            then
              echo "deferred $name: its process leaves this organization; commit a successor request declaring mesh_root, or dispatch with request=$request and mesh_root, to receive it"
              continue
            fi
            out="$RUNNER_TEMP/results/$name"
            mkdir -p "$out"
            python - "$request" "$out" <<'PY'
          import importlib.util, json, sys
          from pathlib import Path
          from stegverse.manifest_builder import build_manifest
          from stegverse.manifest_contract import validate_ingress_manifest
          request = json.loads(Path(sys.argv[1]).read_text())
          out = Path(sys.argv[2])
          spec = importlib.util.spec_from_file_location("ingress", "resident-runtime/organization_manifest_ingress.py")
          ingress = importlib.util.module_from_spec(spec); spec.loader.exec_module(ingress)
          spec = importlib.util.spec_from_file_location("inputs", "resident-runtime/manifest_directed_run_inputs.py")
          inputs = importlib.util.module_from_spec(spec); spec.loader.exec_module(inputs)
          def canonical_of(manifest):
              validate_ingress_manifest(manifest)
              return ingress.derive_execution_request(manifest, ingress.boundary())["canonical_manifest_sha256"]
          resolved = inputs.committed_manifest(request, build=build_manifest, canonical_of=canonical_of)
          if resolved["disposition"] != "ALLOW":
              print(json.dumps(resolved, sort_keys=True))
              sys.exit(1)
          manifest, canonical = resolved["manifest"], resolved["canonical_manifest_sha256"]
          (out / "manifest.json").write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n")
          (out / "standing.json").write_text(json.dumps(request["standing"], indent=2, sort_keys=True) + "\n")
          (out / "canonical_manifest_sha256").write_text(canonical)
          print("built", request["request_id"], "canonical manifest", canonical)
          PY
            canonical=$(cat "$out/canonical_manifest_sha256")
            recorded=$(python resident-runtime/organization_ledger_readback.py \
              --location "$STEGVERSE_ORG_LEDGER_ROOT" --recorded-for "$canonical")
            if [ -n "$recorded" ]; then
              echo "already recorded as $recorded; one manifest is one transition, nothing appended"
              python -c 'import json,sys; json.dump({"disposition":"ALREADY_RECORDED","organization_receipt_sha256":sys.argv[1],"canonical_manifest_sha256":sys.argv[2]}, open(sys.argv[3],"w"))' \
                "$recorded" "$canonical" "$out/ingress.json"
              continue
            fi
            python resident-runtime/organization_manifest_ingress.py \
              --registry org-boundary/registry/services.json \
              --manifest "$out/manifest.json" --standing "$out/standing.json" \
              --packet-id "$name" ${mesh_args[@]+"${mesh_args[@]}"} --out "$out/ingress.json" || true
            python -c 'import json,sys; x=json.load(open(sys.argv[1])); print("ingress disposition:", x["disposition"], x.get("failed_predicate"), x.get("organization_receipt_sha256"))' "$out/ingress.json"
          done < "$RUNNER_TEMP/requests.txt"

      # The frames a request left on the designated mesh are published before
      # the ledger that says they were emitted: a receipt never claims an
      # emission whose frame did not outlive this run.
      - name: Publish the designated mesh ref (fast-forward only)
        run: |
          if [ -z "${MESH_PUBLISH_REF:-}" ]; then
            echo "no mesh ref bound by this run; nothing to publish"; exit 0
          fi
          if ! git rev-parse --verify --quiet "$MESH_PUBLISH_REF" >/dev/null; then
            echo "no frame placed on $MESH_PUBLISH_REF; nothing to publish"; exit 0
          fi
          if ! git push origin "$MESH_PUBLISH_REF:$MESH_PUBLISH_REF"; then
            echo '{"disposition":"FAIL_CLOSED","failure_code":"MESH_REF_PUBLISH_RACE","failed_predicate":"PUBLISHED_MESH_REF_FAST_FORWARDS","required_evidence_or_repair":"another writer moved the mesh ref first; this run published no frame and no ledger receipt","retry_entrypoint":".github/workflows/organization-ledger-transition.yml","owning_existing_goal":"SVORG-MESH-LOCATION-BINDING-001","next_attempt":"commit a successor transition request; it is received again and its frame placed on the moved ref"}'
            exit 1
          fi
          echo "mesh ref published: $MESH_PUBLISH_REF $(git rev-parse "$MESH_PUBLISH_REF")"

      - name: Publish the ledger ref (fast-forward only)
        run: |
          if ! git rev-parse --verify --quiet "$LEDGER_REF" >/dev/null; then
            echo "nothing appended; ledger ref not materialized"; exit 0
          fi
          if ! git push origin "$LEDGER_REF:$LEDGER_REF"; then
            echo '{"disposition":"FAIL_CLOSED","failure_code":"ORGANIZATION_LEDGER_PUBLISH_RACE","failed_predicate":"PUBLISHED_REF_FAST_FORWARDS","required_evidence_or_repair":"another append moved the ref first; this run published nothing","retry_entrypoint":".github/workflows/organization-ledger-transition.yml","owning_existing_goal":"LLMA-DECLARED-PATH-CONFORMANCE-368","next_attempt":"re-run; the request is answered from the ledger if already recorded"}'
            exit 1
          fi

      - name: Read the organization and repository ledgers back from a fresh fetch
        run: |
          set -euo pipefail
          fresh="$RUNNER_TEMP/readback.git"
          git init -q --bare "$fresh"
          auth_header=$(git config --local --get http.https://github.com/.extraheader || true)
          if [ -z "$auth_header" ]; then
            echo '{"disposition":"FAIL_CLOSED","failure_code":"AUTHENTICATED_LEDGER_READBACK_UNAVAILABLE","failed_predicate":"FRESH_FETCH_AUTHENTICATED","required_evidence_or_repair":"checkout credentials unavailable for independent sovereign ref fetch","retry_entrypoint":".github/workflows/organization-ledger-transition.yml","owning_existing_goal":"LLMA-DECLARED-PATH-CONFORMANCE-368","next_attempt":"retry with authorized existing repository contents token"}'
            exit 1
          fi
          git --git-dir="$fresh" -c http.https://github.com/.extraheader="$auth_header" fetch -q "$(git remote get-url origin)" "+$LEDGER_REF:$LEDGER_REF"
          status=0
          for out in "$RUNNER_TEMP"/results/*/; do
            [ -f "$out/ingress.json" ] || continue
            python resident-runtime/organization_ledger_readback.py \
              --location "git+$fresh#$LEDGER_REF" --ingress-result "$out/ingress.json" \
              --manifest "$out/manifest.json" --repository-namespace "$REPO_LEDGER_NAMESPACE" \
              --out "$out/readback.json" || status=1
            {
              echo "### $(basename "$out")"
              echo '```json'
              cat "$out/readback.json"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done
          exit $status

      # What the designated mesh holds after this run, read from a fresh fetch
      # the way a peer that materializes later would read it.
      - name: Read the designated mesh ref back from a fresh fetch
        if: env.MESH_PUBLISH_REF != ''
        run: |
          set -euo pipefail
          fresh="$RUNNER_TEMP/mesh-readback.git"
          git init -q --bare "$fresh"
          if ! git --git-dir="$fresh" fetch -q "$(git remote get-url origin)" "+$MESH_PUBLISH_REF:$MESH_PUBLISH_REF" 2>/dev/null; then
            echo '{"mesh_ref":"'"$MESH_PUBLISH_REF"'","frames":[],"note":"the mesh ref is not published; no request of this run was emitted"}' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python - "$fresh" "$MESH_PUBLISH_REF" "$RUNNER_TEMP/results" <<'PY' | tee "$RUNNER_TEMP/results/mesh-readback.json" >> "$GITHUB_STEP_SUMMARY"
          import importlib.util, json, sys
          from pathlib import Path
          spec = importlib.util.spec_from_file_location("kernel", "org-kernel/kernel.py")
          kernel = importlib.util.module_from_spec(spec); spec.loader.exec_module(kernel)
          store = kernel.mesh_store("git+" + sys.argv[1] + "#" + sys.argv[2])
          frames = [store.get(key) for key in store.list_prefix(kernel.node_store_module.MESH_FRAME_PREFIX)]
          emitted = [json.loads(p.read_text()) for p in Path(sys.argv[3]).glob("*/ingress.json")]
          emitted = [x for x in emitted if x.get("emission_transition_class") == "ORGANIZATION_EGRESS_EMITTED"]
          out = {"schema": "stegverse.mesh-readback/v1", "mesh_ref": sys.argv[2], "frame_count": len(frames),
                 "frames": [{"destination_org": f.get("destination_org"), "frame_sha256": f.get("frame_sha256")} for f in frames],
                 "emitted_by_this_run": len(emitted), "authority_effect": "NONE_READBACK_ONLY"}
          print(json.dumps(out, indent=2, sort_keys=True))
          if emitted and not frames:
              raise SystemExit("an emission was recorded but the published mesh holds no frame")
          PY

      - name: Retain the run's evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: organization-ledger-transition
          path: ${{ runner.temp }}/results
          if-no-files-found: ignore
