name: Required Verification

# StegVerse-org/.github#166. Rigel's standing rule (relayed by Coordination, Oct 23): merge readiness needs
# the full suite run on the exact head with 0 skipped. Every pull request, with no path filter:
#   full-suite  every tests/test_*.py under the strict runner (resident-runtime/required_verification.py):
#               a skipped, expected-failure, unexpected-success, unloaded or zero-test run, or a test present
#               at the base and missing at the head, is FAIL_CLOSED REQUIRED_VERIFICATION_SKIPPED; a failing
#               test is REQUIRED_TEST_FAILED (this repository holds no receipted baseline, so nothing is
#               marked pre-existing).
#   path-scope  a path-filtered workflow left unrun on a change to a file it runs, and a pull_request job
#               present at the base and missing at the head, are FAIL_CLOSED REQUIRED_VERIFICATION_SKIPPED.
# E0: stdlib only, no clock, nothing published, read-only token.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  full-suite:
    runs-on: ubuntu-latest
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      WORKFLOW_REF: .github/workflows/required-verification.yml full-suite
    steps:
      - name: Checkout organization boundary
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Full suite (strict, 0 skipped, exact head)
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^2)" = "$HEAD_SHA"
          git config --global user.name ci
          git config --global user.email ci@stegverse.invalid
          mkdir -p "$RUNNER_TEMP/results"
          python3 resident-runtime/required_verification.py run --pattern 'test_*.py' --base "$BASE_SHA" \
            --retry-entrypoint "$WORKFLOW_REF" --out "$RUNNER_TEMP/results/full-suite.json"

      - name: Retain the record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: required-verification-full-suite
          path: ${{ runner.temp }}/results

  path-scope:
    runs-on: ubuntu-latest
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout organization boundary
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: No required job is path-filtered out or missing
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^2)" = "$HEAD_SHA"
          python3 resident-runtime/required_verification.py path-scope --base "$BASE_SHA" --head "$HEAD_SHA" \
            --retry-entrypoint ".github/workflows/required-verification.yml path-scope" --out "$RUNNER_TEMP/path-scope.json"

  # Green only when every job above completed and succeeded: a skipped, cancelled or failed job (or one an
  # `if:` left unrun) fails this gate closed with six fields. Validation only.
  required-verification:
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs: [full-suite, path-scope]
    steps:
      - name: Every required job completed and succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          needs = json.loads(os.environ["RESULTS"])
          bad = {k: v["result"] for k, v in needs.items() if v["result"] != "success"}
          print(json.dumps({k: v["result"] for k, v in needs.items()}, sort_keys=True))
          if bad or set(needs) != {"full-suite", "path-scope"}:
              print("FAIL_CLOSED REQUIRED_VERIFICATION_SKIPPED", json.dumps({
                  "failure_code": "REQUIRED_VERIFICATION_SKIPPED",
                  "failed_predicate": "EVERY_REQUIRED_JOB_COMPLETED_AND_SUCCEEDED",
                  "required_evidence_or_repair": f"jobs not successful: {bad}",
                  "retry_entrypoint": ".github/workflows/required-verification.yml (pull_request)",
                  "owning_existing_goal": "StegVerse-org/.github#166",
                  "next_attempt": "the next push to this pull request"}, sort_keys=True))
              raise SystemExit(1)
          PY
