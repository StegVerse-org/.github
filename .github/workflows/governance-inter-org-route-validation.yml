name: Validate Governance Inter-Organization Route

on:
  pull_request:
    branches: [main]
    paths:
      - 'resident-runtime/governance_endpoint.py'
      - 'resident-runtime/governance_decision_return.py'
      - 'resident-runtime/federation_cycle.py'
      - 'resident-runtime/organization_manifest_ingress.py'
      - 'resident-runtime/organization_egress_boundary.py'
      - 'resident-runtime/sdk_manifest_crossing.py'
      - 'resident-runtime/aggregate_repo_transition.py'
      - '.stegverse/transition-ledger/emit.py'
      - 'org-kernel/kernel.py'
      - 'org-runtime/interlock-intr.json'
      - 'org-boundary/runtime/process_boundary.py'
      - 'org-boundary/registry/services.json'
      - 'org-boundary/registry/federation.json'
      - 'tests/test_governance_inter_org_route.py'
      - 'tests/test_governance_mesh_locator_readback.py'
      - 'org-kernel/node_store.py'
      - 'resident-runtime/organization_ledger_readback.py'
      - 'tests/fixtures/sdk-manifests/**'
      - 'docs/GOVERNANCE_INTER_ORG_ROUTE_MIRROR_HANDOFF.md'
      - 'docs/peer-patches/stegverse-labs.governance-endpoint.patch'
      - 'resident-runtime/peer_mesh_intake.py'
      - 'resident-runtime/governance_return_cycle.py'
      - 'resident-runtime/mesh_locator_binding.py'
      - 'tests/test_governance_return_peer_mesh.py'
      - '.github/workflows/organization-governance-return.yml'
      - 'tests/test_governance_request_vocabulary.py'
      - '.stegverse/transition-requests/**'
      - '.github/workflows/governance-inter-org-route-validation.yml'
  push:
    branches: [main]
    paths:
      - 'resident-runtime/governance_endpoint.py'
      - 'resident-runtime/governance_decision_return.py'
      - 'resident-runtime/federation_cycle.py'
      - 'resident-runtime/organization_manifest_ingress.py'
      - 'resident-runtime/organization_egress_boundary.py'
      - 'resident-runtime/sdk_manifest_crossing.py'
      - 'resident-runtime/aggregate_repo_transition.py'
      - '.stegverse/transition-ledger/emit.py'
      - 'org-kernel/kernel.py'
      - 'org-runtime/interlock-intr.json'
      - 'org-boundary/runtime/process_boundary.py'
      - 'org-boundary/registry/services.json'
      - 'org-boundary/registry/federation.json'
      - 'tests/test_governance_inter_org_route.py'
      - 'tests/test_governance_mesh_locator_readback.py'
      - 'org-kernel/node_store.py'
      - 'resident-runtime/organization_ledger_readback.py'
      - 'tests/fixtures/sdk-manifests/**'
      - 'docs/GOVERNANCE_INTER_ORG_ROUTE_MIRROR_HANDOFF.md'
      - 'docs/peer-patches/stegverse-labs.governance-endpoint.patch'
      - 'resident-runtime/peer_mesh_intake.py'
      - 'resident-runtime/governance_return_cycle.py'
      - 'resident-runtime/mesh_locator_binding.py'
      - 'tests/test_governance_return_peer_mesh.py'
      - '.github/workflows/organization-governance-return.yml'
      - 'tests/test_governance_request_vocabulary.py'
      - '.stegverse/transition-requests/**'
      - '.github/workflows/governance-inter-org-route-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-governance-route:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout organization boundary
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The SDK derives the request and admits the returned decision. Pinned to
      # the post-migration SDK every workflow in this repository uses
      # (StegVerse-SDK#452/#466): it admits a governance result recorded in
      # organization records only and emits ORGANIZATION_LEDGER as the custody
      # authority.
      - name: Checkout exact merged SDK manifest state-transition runtime
        uses: actions/checkout@v4
        with:
          repository: StegVerse-org/StegVerse-SDK
          ref: 6e751932d103f1dfb23e1990a8e8c9a25c95e680
          path: sdk
          persist-credentials: false

      - name: Install SDK test dependency surface
        run: python -m pip install -e ./sdk

      # Both ledgers and the mesh are redirected by the tests themselves, so no
      # step appends into an operator's runtime reality.
      - name: Governance is decided by StegVerse-Labs over InTr and returned on organization records
        env:
          STEGVERSE_REPO_LEDGER_ROOT: ${{ runner.temp }}/repo-ledger
          STEGVERSE_ORG_LEDGER_ROOT: ${{ runner.temp }}/org-ledger
        run: python -m unittest tests.test_governance_inter_org_route -v

      # A governance request on a materializer-supplied git-ref mesh leaves and is
      # read back by a peer; without a mesh it is refused with six fields and
      # recorded on both chains. Temporary repositories only.
      - name: A governance request leaves on a supplied git-ref mesh, and is refused on the ledger without one
        run: python -m unittest tests.test_governance_mesh_locator_readback -v

      - name: A deciding organization's answer on its own mesh ref is taken in and returned, once
        run: python -m unittest tests.test_governance_return_peer_mesh -v

      - name: A committed governance request uses the deciding organization's request vocabulary
        run: python -m unittest tests.test_governance_request_vocabulary -v
