name: Validate Peer Migration Artifacts

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/migrations/**'
      - 'docs/PEER_KERNEL_GENERATION_ADMISSION_MIGRATION_002.md'
      - 'org-boundary/runtime/node_standing.py'
      - 'docs/CANONICAL_NODE_INGRESS_CONTRACT_001.json'
      - 'tests/test_peer_migration_artifacts.py'
      - '.github/workflows/peer-migration-artifacts.yml'
  push:
    branches: [main]
    paths:
      - 'docs/migrations/**'
      - 'docs/PEER_KERNEL_GENERATION_ADMISSION_MIGRATION_002.md'
      - 'org-boundary/runtime/node_standing.py'
      - 'docs/CANONICAL_NODE_INGRESS_CONTRACT_001.json'
      - 'tests/test_peer_migration_artifacts.py'
      - '.github/workflows/peer-migration-artifacts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-peer-migration-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout organization boundary
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          # The record names commits of this repository, and
          # test_every_sha_the_record_attributes_to_this_repository_is_real
          # resolves them. A depth-1 checkout does not carry them, so the
          # guard would fail on the clone rather than on the record. Full
          # history is what makes that check mean what it says.
          fetch-depth: 0

      - name: Validate the recorded patches
        run: python -m unittest tests.test_peer_migration_artifacts -v

      - name: Each patch is a unified diff git itself can read
        run: |
          # `git apply --check` needs the peer's tree and cannot run here, but
          # a malformed diff is catchable without one: numstat parses the patch
          # and reports its paths, and fails on a corrupt hunk header.
          for patch in docs/migrations/*.patch; do
            echo "== $patch"
            git apply --numstat "$patch"
          done

      - name: Declare what a recorded patch is not
        run: |
          echo 'authority_effect=NONE_MIGRATION_ARTIFACT_ONLY'
          echo 'patch_recorded_here_is_applied=false'
          # Not a blanket claim any more: StegVerse-Labs applied it and runs
          # the gate on its default branch, Admissible-Existence has not. The
          # blanket form was false from the moment the first owner applied.
          echo 'peer_default_branches_running_the_gate=1_of_2'
          echo 'peer_default_branch_running_the_gate=StegVerse-Labs'
          echo 'peer_default_branch_not_running_the_gate=Admissible-Existence'
          echo 'standing_admitted_is_origin_authenticated=false'
